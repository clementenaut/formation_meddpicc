      {q:"Qu'est-ce qu'un Compelling Event et pourquoi est-il précieux ?",opts:["Un événement externe qui crée une deadline naturelle et renforce l'urgence d'agir","L'événement qui déclenche la signature du contrat","Un événement marketing (salon, webinar) pour créer de l'engagement","Le moment où le commercial présente sa proposition"],c:0,e:"Un Compelling Event est externe au cycle de vente — fin de support, audit, renouvellement contractuel. Il est précieux parce qu'il crée une urgence que le commercial n'a pas à imposer : elle vient de la réalité du client."},
      {q:"Quand est le bon moment pour découvrir la douleur dans le cycle de vente ?",opts:["Uniquement si le client en parle spontanément","Après avoir présenté la solution pour lier la douleur aux fonctionnalités","Au moment de la proposition pour justifier le prix","Le plus tôt possible — la douleur est le fondement de tout le deal"],c:3,e:"La douleur est le socle de MEDDPICC. Si tu ne la qualifies pas tôt, tu construis tout le deal sur du sable. La proposition, la démonstration, les métriques — tout doit s'ancrer dans la douleur identifiée et partagée."},
      {q:"Un prospect dit : 'On aimerait moderniser notre infra, mais c'est pas urgent.' Que faites-vous ?",opts:["Acceptez que ce n'est pas urgent et revenez dans 6 mois","Cherchez un Compelling Event : y a-t-il une deadline externe (contrat, audit, fin de support) qui rende l'inaction coûteuse ?","Créez artificiellement l'urgence avec une offre limitée","Abandonnez le deal — sans urgence, il n'y a pas de deal"],c:1,e:"'Pas urgent' signifie souvent 'je n'ai pas mesuré le coût d'attendre'. Un Compelling Event latent existe presque toujours. Votre rôle : aider le client à voir ce qui rend l'inaction risquée, pas inventer une fausse urgence."},
      {q:"La douleur d'un DSI (pannes, maintenance) et la douleur d'un DG (risque contractuel, coût) sont-elles identiques ?",opts:["Oui — le problème technique impacte tout le monde de la même façon","Non — elles sont complémentaires mais s'expriment différemment. Il faut qualifier les deux.","Seule la douleur technique du DSI compte","Seule la douleur du DG compte"],c:1,e:"Le DSI vit la douleur opérationnellement, le DG la vit financièrement et stratégiquement. Pour convaincre l'EB, présentez la douleur dans son langage — business, financier, risque — pas dans le langage technique."},
      {q:"Un prospect a une douleur forte mais aucun Compelling Event. Quel est le risque principal ?",opts:["Aucun risque — une forte douleur suffit à créer l'urgence","La douleur n'est pas réelle sans deadline","Le deal peut traîner indéfiniment — la douleur forte sans deadline peut toujours être reportée","Le deal ne peut pas se closer sans Compelling Event"],c:2,e:"Même une douleur forte peut coexister avec l'inaction si rien n'impose un délai. Le statu quo est confortable. Sans Compelling Event, le prospect peut reporter à chaque trimestre. Trouver ou créer un Compelling Event légitime est une priorité."}
    ],
    caseStudy:{
      label:"📋 Étude de cas — La douleur qui ne crée pas d'urgence",
      doc:`<p><strong>Source :</strong> Notes d'appel — Commercial : Emma G. — Kevin Marais, DSI — Teralia (BTP, 110 personnes)</p><hr style="border:none;border-top:1px solid var(--border);margin:10px 0"><p><em>Kevin : "Ouais, on a des lenteurs sur notre réseau. Et notre serveur de fichiers date de 2017."</em></p><p><em>Emma : "Et ça vous coûte quoi ces problèmes ?"</em></p><p><em>Kevin : "Bah... du temps perdu je suppose. C'est pas catastrophique hein, on s'en sort. Mais ce serait bien d'améliorer ça."</em></p><p><em>Emma : "D'accord. Je vous prépare une proposition cloud."</em></p>`,
      questions:[
        {q:"Emma a-t-elle correctement qualifié la douleur avant de proposer ?",opts:["Non — la douleur est vague, non chiffrée, et Kevin dit lui-même que ce n'est pas catastrophique","Oui — Kevin a décrit des problèmes concrets","Non, mais une proposition peut révéler la valeur","Oui — lenteurs et serveur vieux sont des douleurs IT classiques"],c:0,e:"'C'est pas catastrophique, on s'en sort' est l'opposé d'une douleur qualifiée. Emma s'apprête à proposer pour un problème que Kevin ne considère pas urgent. Sans douleur forte ni Compelling Event, cette proposition a peu de chances d'aboutir."},
        {q:"Quelles questions Emma aurait dû poser pour impliquer la douleur ?",opts:["Quel est votre budget ?","Qu'est-ce qui se passe si un plan de chantier n'est pas accessible au bon moment ? Et si ce problème persiste 12 mois, quel impact sur vos chantiers et vos clients ?","Combien de serveurs avez-vous ?","Avez-vous regardé d'autres solutions ?"],c:1,e:"La question d'implication creuse les conséquences business : retard de chantier = pénalités client, image dégradée. Kevin vit le problème comme un inconfort IT — Emma doit l'aider à voir le coût business de l'inaction."},
        {q:"Emma envoie la proposition. Quel sera probablement le résultat ?",opts:["Kevin la transmettra directement au DG","La proposition sera lue avec intérêt mais ne créera pas d'urgence — Kevin la mettra 'en attente' indéfiniment","La proposition sera signée rapidement","La proposition sera rejetée immédiatement"],c:1,e:"Sans douleur forte ni Compelling Event, une proposition atterrit dans la pile 'intéressant mais pas prioritaire'. Emma devrait reprendre la qualification de la douleur avant de proposer — pas après."}
      ]
    }
  },

  // 8 — CHAMPION
  {
    id:'champion', nav:'Champion', sub:'C — Module 8',
    badge:'C — Champion', title:'C — Champion',
    subtitle:"Identifier et développer l'allié interne qui va vendre pour toi quand tu n'es pas dans la pièce.",
    blocks:[
      {t:'prose',h:'Définition',p:`<p>Le <strong>Champion</strong> est un sponsor interne enthousiaste, influent, capable de promouvoir ton projet et ton approche quand tu n'es pas là. Ce n'est pas un simple contact sympa — c'est quelqu'un qui a un intérêt personnel au succès du projet <em>et</em> l'influence pour le faire avancer.</p><p>La formule : <strong>Champion = Enthousiasme + Influence + Accès</strong>. Les trois conditions sont nécessaires. Un champion enthousiaste sans influence est un contact agréable, pas un champion.</p>`},
      {t:'cards',n:2,cards:[{ico:'🤝',name:'Coach vs Champion',p:"Un coach vous donne de l'information. Un champion se bat pour vous en interne, organise des réunions avec l'EB, défend votre solution face aux sceptiques."},{ico:'🎯',name:'Intérêt personnel',p:"Tout champion a une raison personnelle de vouloir ce projet : promotion, résolution d'un problème récurrent, reconnaissance interne. Cette motivation est ton levier."}]},
      {t:'hl',v:'blue',lbl:'Tester ton champion',body:`Un vrai champion agit. Pour le tester :<br>— Lui demander d'organiser une réunion avec l'EB → le fait-il ?<br>— Lui demander de partager une information interne (budget, concurrents en lice) → le fait-il ?<br>— Lui demander de défendre un argument spécifique en interne → le fait-il ?<br><br>Si le champion ne peut ou ne veut pas agir, c'est un contact, pas un champion.`},
      {t:'prose',h:'Développer un champion',p:`<p>Parfois le champion n'existe pas encore — il faut le créer. Les étapes :</p><p>1. Identifier la personne la plus susceptible d'avoir un intérêt personnel dans le projet.<br>2. L'aider à comprendre et à articuler la valeur du projet pour lui personnellement.<br>3. Lui donner les outils pour vendre en interne : chiffres, arguments, slides, réponses aux objections.<br>4. Construire la relation en transparence — partager ce que tu fais, pourquoi, ce dont tu as besoin de lui.</p>`},
      {t:'hl',v:'amber',lbl:'⚠️ Erreurs courantes',body:`<strong>1. Confondre "contact" et "champion"</strong> — La personne enthousiaste en réunion n'est pas forcément ton champion si elle n'a pas d'influence.<br><br><strong>2. Ne pas vérifier l'accès à l'EB</strong> — Un champion qui n'a jamais de conversation directe avec l'EB ne peut pas faire avancer ton deal.<br><br><strong>3. Un seul champion</strong> — Si ton champion unique quitte l'entreprise ou change de poste, le deal meurt. Idéalement : 2 champions à des niveaux différents.`},
      {t:'questions',h:'Questions pour qualifier et développer le champion',qs:["Pourquoi ce projet est-il important pour vous personnellement ?","Êtes-vous prêt à défendre ce projet en interne si on vous demande pourquoi ce choix ?","Pouvez-vous organiser une réunion avec le DG pour valider l'alignement stratégique ?","Comment s'est passée votre dernière réunion avec le DG sur ce sujet ?","Y a-t-il d'autres personnes dans votre équipe qui soutiennent ce projet ?","Quels sont les sceptiques en interne et comment les adressez-vous ?"]},
      {t:'scenario',lbl:'🏭 NovaCorp — Julien comme Champion',p:`<p><strong>Julien</strong> est enthousiaste ✅. Il comprend la valeur technique ✅. Il connaît les problèmes internes ✅.</p><p>Mais : il n'a pas encore organisé la réunion avec Sophie (EB) ⚠️. Quand tu lui demandes, il dit "Sophie est difficile d'accès, je préfère lui présenter ça quand on aura une proposition concrète."</p><p>⚠️ <strong>Signal d'alarme :</strong> Un champion fort ne retarde pas l'accès à l'EB — il le facilite. Ce comportement peut indiquer :<br>— Il a peur que Sophie rejette le projet<br>— Il n'a pas autant d'accès qu'il le laisse entendre<br>— Il veut contrôler le message</p><p>✅ <strong>Action :</strong> Fournir à Julien les arguments clés, le "script" pour présenter à Sophie, et relancer sur la réunion avec une date précise.</p>`}
    ],
    quiz:[
      {q:"Julien est enthousiaste, compétent et bien informé sur ton projet. Est-ce un bon champion ?",opts:["Oui, s'il est le DSI il a forcément l'influence nécessaire","Pas encore — il faut aussi vérifier son influence réelle et son accès à l'EB","Non, un DSI ne peut jamais être champion car il n'a pas accès au budget","Oui, l'enthousiasme et la compétence suffisent"],c:1,e:"Champion = Enthousiasme + Influence + Accès. L'enthousiasme seul ne suffit pas. Il faut vérifier : peut-il organiser la réunion avec l'EB ? Peut-il défendre le projet en interne ? A-t-il l'oreille du DG ?"},
      {q:"Comment tester si Julien est un vrai champion ou juste un contact sympa ?",opts:["Lui demander d'agir concrètement : organiser une réunion avec la DG, partager des informations internes, défendre un argument spécifique","Lui demander son avis sur le concurrent","Lui demander de signer un document","Lui envoyer un questionnaire de satisfaction"],c:0,e:"Un champion se teste par l'action, pas par les déclarations d'intention. S'il accepte d'agir — et agit vraiment — c'est un champion. S'il recule, hésite ou ne fait pas ce qu'il promet, c'est un contact agréable, pas un champion."},
      {q:"Julien est ton seul champion. Quel est le risque principal ?",opts:["Il parlera de ton offre à tes concurrents","La proposition sera trop technique","La DG ne fera pas confiance à Julien","Si Julien quitte NovaCorp ou change de priorités, le deal meurt instantanément"],c:3,e:"Un deal mono-champion est fragile. Si le champion unique part, est absent ou change de priorités, tu n'as plus de relais interne. Idéalement, développe un second champion à un niveau différent — typiquement quelqu'un proche de l'EB."},
      {q:"Quelle est la différence entre un Champion et un Coach ?",opts:["Le Champion est technique, le Coach business","Il n'y a pas de différence","Le Coach donne de l'information, le Champion se bat pour vous en interne et prend des risques","Le Coach est plus senior"],c:2,e:"Un coach est utile — il partage des infos, répond aux questions. Mais il ne prend pas de risque pour vous. Un champion défend votre solution en réunion interne sans que vous soyez là et met son capital politique en jeu."},
      {q:"Votre champion vous dit 'je vous soutiens à 100%, mais je ne peux pas parler de ça au DG maintenant'. Que concluez-vous ?",opts:["Normal — le DG est souvent occupé","Signal d'alarme : un champion fort trouve un moyen d'accéder à l'EB. Ce blocage révèle soit un manque d'influence, soit une réticence à prendre des risques.","Il attend la proposition pour présenter quelque chose de concret","Il est honnête — respectez son jugement"],c:1,e:"Un champion qui ne peut pas ou ne veut pas organiser l'accès à l'EB n'est pas un vrai champion pour ce deal. La réticence peut être liée à son manque d'influence réelle ou à la peur du rejet du projet."},
      {q:"Pour développer un champion qui n'est pas encore convaincu, quelle est la démarche la plus efficace ?",opts:["Le mettre en copie de toutes vos communications","L'aider à comprendre ce que ce projet lui apporte personnellement, puis lui fournir les outils pour le défendre en interne","Lui offrir un cadeau commercial","Lui envoyer des plaquettes commerciales"],c:1,e:"Un champion se développe en alignant son intérêt personnel avec le succès du projet. Si la modernisation de l'infra fait de lui le DSI qui a 'transformé l'IT', il a une raison personnelle forte de défendre le projet."}
    ],
    caseStudy:{
      label:"📋 Étude de cas — Le champion qui promet mais ne livre pas",
      doc:`<p><strong>Source :</strong> Échanges email — Commercial : Clara M. — Deal Winvex Industries</p><hr style="border:none;border-top:1px solid var(--border);margin:10px 0"><p><em>Semaine 1 — Thomas (DSI) après la démo :<br>"Clara, votre solution est exactement ce qu'il nous faut. Je vais en parler à notre DG dès cette semaine."</em></p><p><em>Semaine 3 — Clara relance :<br>Thomas : "Pas encore, il a eu une semaine chargée."</em></p><p><em>Semaine 5 :<br>Thomas : "Le DG est en déplacement."</em></p><p><em>Semaine 7 :<br>Thomas : "Le DG est disponible mais je préfère attendre d'avoir votre proposition finale pour lui présenter quelque chose de concret."</em></p>`,
      questions:[
        {q:"Thomas est-il un champion au sens MEDDPICC ?",opts:["Oui — il est enthousiaste et a clairement indiqué son soutien","Trop tôt pour juger","Non — 7 semaines sans accès EB organisé révèle soit un manque d'influence, soit une réticence à prendre des risques","Oui s'il finit par organiser la réunion"],c:2,e:"Un champion réel ne laisse pas passer 7 semaines. Chaque semaine, une nouvelle excuse. Ce pattern révèle que Thomas soit n'a pas l'accès qu'il prétend, soit ne veut pas risquer une réponse négative du DG."},
        {q:"Clara devrait-elle attendre la proposition pour que Thomas présente au DG ?",opts:["Oui — une proposition facilite la réunion DG","Ça dépend du montant","Oui — Thomas connaît mieux le bon timing","Non — attendre la proposition pour rencontrer l'EB est une erreur classique. La réunion EB doit précéder la proposition pour aligner les priorités."],c:3,e:"Envoyer une proposition sans avoir rencontré l'EB, c'est risquer de travailler des heures pour produire quelque chose qui ne résonne pas avec les priorités du DG."},
        {q:"Quelle action Clara devrait prendre après la semaine 7 ?",opts:["Envoyer la proposition directement au DG","Chercher une autre entrée : demander à Thomas un email d'introduction préparé par Clara, ou trouver une autre entrée vers le DG","Attendre — Thomas finira par organiser","Abandonner le deal"],c:1,e:"Clara doit soit débloquer Thomas ('Thomas, voici un email que vous pouvez transférer à votre DG'), soit trouver une entrée alternative. L'inaction de Thomas ne peut pas bloquer l'accès à l'EB indéfiniment."}
      ]
    }
  },

  // 9 — COMPETITION
  {
    id:'competition', nav:'Competition', sub:'C — Module 9',
    badge:'C — Competition', title:'C — Competition',
    subtitle:"Identifier toutes les alternatives réelles — et se différencier sur la perception du client, pas sur ta propre opinion.",
    blocks:[
      {t:'prose',h:'Définition',p:`<p>La <strong>Competition</strong> dans MEDDPICC va bien au-delà des concurrents directs. Elle inclut toutes les alternatives que le client pourrait choisir à la place de ta solution :</p>`},
      {t:'list',items:[{b:'Concurrents directs',t:" — Les autres fournisseurs proposant une solution similaire."},{b:'Solutions internes',t:" — Développement maison, IT interne qui pense 'on peut le faire nous-mêmes'."},{b:'Projets concurrents',t:" — D'autres initiatives en cours qui mobilisent le même budget ou la même attention."},{b:'Le statu quo',t:" — Ne rien faire. C'est souvent le concurrent le plus dangereux en PME."}]},
      {t:'hl',v:'blue',lbl:'Règle clé',body:`La différenciation concurrentielle doit se faire sur <strong>la perception du client</strong>, pas sur ton opinion. Ce qui compte : comment le client perçoit ta solution vs les alternatives. Pas ce que toi tu penses de ton concurrent.`},
      {t:'prose',h:'Stratégie face au concurrent prix',p:`<p>Dans la vente IT aux PME, tu rencontreras souvent un concurrent moins cher. La mauvaise réaction : baisser ton prix. La bonne réaction :</p><p>1. Identifier les <strong>Decision Criteria</strong> sur lesquels tu surpassses le concurrent.<br>2. Aider le client à pondérer ces critères davantage.<br>3. Quantifier le coût total de possession (TCO) : parfois le moins cher à l'achat coûte plus cher sur 3 ans.<br>4. Utiliser tes <strong>références clients</strong> dans le même secteur.</p>`},
      {t:'hl',v:'amber',lbl:'⚠️ Le statu quo — Le concurrent oublié',body:`En PME, la décision "on ne fait rien" est courante. Le DG a d'autres priorités, le budget peut aller ailleurs, la douleur ne semble pas assez forte pour décider maintenant. <strong>Ton vrai rôle :</strong> quantifier le coût d'inaction pour rendre le statu quo plus douloureux que le changement.`},
      {t:'questions',h:'Questions pour qualifier la compétition',qs:["Étudiez-vous d'autres options en parallèle ?","Avez-vous déjà travaillé avec certains de nos concurrents ? Quelle a été votre expérience ?","Y a-t-il d'autres projets en cours qui pourraient être en concurrence pour ce budget ?","Comment nous positionnez-vous par rapport aux autres options ?","Qu'est-ce qui vous ferait choisir une alternative à notre solution ?"]},
      {t:'scenario',lbl:'🏭 NovaCorp — Paysage concurrentiel',p:`<p>Julien mentionne qu'une autre ESN régionale a aussi proposé une solution, 20% moins chère.</p><p><strong>Analyse concurrentielle :</strong><br>— Concurrent A : moins cher, mais hébergement en Allemagne (ne répond pas au critère contractuel de NovaCorp) ❌<br>— Votre ESN : hébergement France ✅, intégration Sage 100 confirmée ✅, SLA 99,9% garanti ✅</p><p>⚠️ <strong>Vrai concurrent : le statu quo.</strong> Sophie (EB) a d'autres projets en cours et peut vouloir repousser la décision à l'an prochain.</p><p>✅ <strong>Stratégie :</strong> Utiliser le Compelling Event (renouvellement grand compte dans 4 mois) pour rendre le statu quo inacceptable — et montrer que le concurrent A ne répond pas aux critères non-négociables.</p>`}
    ],
    quiz:[
      {q:"Le concurrent A est moins cher. Ta première réaction devrait être :",opts:["Proposer un rabais conditionnel","Identifier si le concurrent répond aux critères non-négociables du client (ex: hébergement France) avant de parler de prix","Baisser immédiatement ton prix pour t'aligner","Attaquer la qualité du concurrent"],c:1,e:"Avant de parler de prix, vérifie si le concurrent répond vraiment aux critères du client. Dans NovaCorp, le concurrent A n'héberge pas en France — ce qui est un critère contractuel absolu. Le prix ne compte plus si le critère fondamental n'est pas rempli."},
      {q:"Quel est souvent le concurrent le plus dangereux dans une vente IT en PME ?",opts:["Le plus grand acteur du marché","La solution interne de l'IT","La solution open-source","Le statu quo — ne rien faire"],c:3,e:"Le statu quo est le concurrent le plus commun et le plus sous-estimé. Le DG a d'autres priorités, le budget peut aller ailleurs. Ton rôle : rendre le coût d'inaction plus douloureux que le coût du changement."},
      {q:"Comment se différencier efficacement d'un concurrent ?",opts:["En se positionnant sur les critères de décision du client, pas sur ton propre jugement de ta solution","En attaquant les faiblesses du concurrent directement","En baissant son prix en dernier recours","En listant toutes les fonctionnalités supérieures"],c:0,e:"La différenciation efficace se fait sur la perception du client, pas sur tes convictions. Quels critères sont importants pour lui ? Sur lesquels tu excelles ? C'est là que tu joues, pas sur une comparaison feature-by-feature que le client n'a pas demandée."},
      {q:"Un prospect vous dit qu'il regarde d'autres options sans préciser lesquelles. Comment réagissez-vous ?",opts:["Demandez avec tact : 'Étudiez-vous d'autres ESN, ou considérez-vous aussi une solution interne ?'","Menacez de retirer votre offre","Respectez sa discrétion et attendez","Baissez votre prix pour sécuriser"],c:0,e:"La question ouverte et bienveillante distingue les types de concurrence (ESN vs solution interne vs statu quo) sans créer de tension, tout en obtenant les informations pour adapter votre positionnement."},
      {q:"Vous découvrez en semaine 6 qu'un concurrent est évalué depuis la semaine 2. Que révèle cela sur votre contact ?",opts:["Que votre contact n'est probablement pas un vrai champion — un champion partage ce type d'information","Que vous avez perdu le deal","Que le prospect n'est pas fiable","Que vous étiez en faiblesse dès le départ"],c:0,e:"Un champion partage les informations stratégiques — notamment la présence de concurrents — parce qu'il veut vous aider à gagner. Ne pas vous informer d'un concurrent actif est un signal fort que votre contact n'est pas vraiment dans votre camp."},
      {q:"Votre prospect est en train d'évaluer une solution interne ('notre équipe IT peut le faire'). Comment vous positionnez-vous ?",opts:["Déconseiller activement la solution interne","Expliquez que votre solution est techniquement supérieure","Quantifiez le coût réel de la solution interne : temps équipe IT, délai déploiement, maintenance, risque qualité — comparez avec votre TCO","Proposez un prix inférieur au coût estimé"],c:2,e:"La solution interne semble gratuite mais ne l'est pas. L'équipe IT a un coût, le projet prendra du temps, la maintenance sera continue. Un TCO honnête et comparatif démontre souvent que l'option interne est plus chère sur 3 ans."}
    ],
    caseStudy:{
      label:"📋 Étude de cas — 'On regarde plusieurs options'",
      doc:`<p><strong>Source :</strong> Notes de réunion — Commercial : Nicolas B. — Alain Dupré, DSI — Carbex (industrie, 160 personnes)</p><hr style="border:none;border-top:1px solid var(--border);margin:10px 0"><p><em>Alain en fin de réunion : "C'est intéressant votre approche. On regarde plusieurs options en ce moment."</em></p><p><em>Nicolas : "Vous regardez d'autres ESN ?"</em></p><p><em>Alain : "Oui, entre autres. On a aussi un projet de refonte ERP en cours qui mobilise beaucoup de budget en ce moment."</em></p><p><em>Nicolas (note CRM) : "Concurrents ESN identifiés. Deal OK. Suite : envoyer proposition."</em></p>`,
      questions:[
        {q:"Nicolas a-t-il correctement identifié la compétition dans sa note CRM ?",opts:["Oui si les ESN ne répondent pas aux critères","Non — il a manqué le concurrent le plus dangereux : le projet ERP concurrent qui mobilise budget et attention","Oui — il a noté la présence de concurrents ESN","Oui — identifier les ESN suffit"],c:1,e:"Alain a révélé deux informations : d'autres ESN ET un projet ERP concurrent. Le projet ERP est potentiellement plus dangereux — il mobilise le même budget et la même bande passante managériale."},
        {q:"La refonte ERP en cours représente quel type de concurrence ?",opts:["Une concurrence indirecte mineure","Un projet concurrent qui mobilise le même budget et la même attention — peut retarder ou tuer le deal","Une opportunité — vendre en même temps que l'ERP","Pas une vraie concurrence — c'est un projet différent"],c:1,e:"Un projet ERP en cours est une compétition pour le budget et pour le temps de l'EB. Si le DG doit choisir entre financer l'ERP et votre projet cloud, l'ERP peut gagner même si votre solution est objectivement meilleure."},
        {q:"Quelle question Nicolas aurait dû poser sur le projet ERP ?",opts:["Peut-on intégrer notre solution avec votre futur ERP ?","Qui pilote le projet ERP ?","Quel est le calendrier et le budget de ce projet ERP ? Est-il en concurrence avec notre projet pour l'enveloppe de cette année ?","Quel ERP avez-vous choisi ?"],c:2,e:"La question budgétaire et calendaire est décisive. Si l'ERP démarre au Q3 et mobilise 80k€, votre projet de 40k€ sera probablement repoussé à l'année suivante. Le comprendre maintenant permet d'ajuster le timing ou de démontrer que les deux projets sont complémentaires."}
      ]
    }
  },

  {

      {t:'scorecard'},
      {t:'hl',v:'blue',lbl:'Analyse des risques',body:`Les dimensions en <strong>orange/rouge</strong> sont tes priorités immédiate.<br><br><strong>Paper Process inconnu</strong> → risque majeur : tu pourrais remettre une proposition et attendre 6 semaines sans savoir pourquoi.<br><strong>Competition partielle</strong> → le statu quo n'est pas traité. Sophie peut décider de repousser à l'an prochain.`},
