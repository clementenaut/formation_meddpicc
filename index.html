<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formation MEDDPICC — Sales Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Palette officielle */
  --arc-navy:#0C2762;
  --arc-blue:#1659E4;
  --arc-teal:#6BE7DD;
  --arc-coral:#FA7B4E;
  --arc-yellow:#F1C557;

  /* Fond clair */
  --bg:#f0f4fb;--bg2:#ffffff;--bg3:#f7f9fd;--bg4:#e8eef8;
  --border:rgba(12,39,98,.1);

  /* Accent principal */
  --blue:#1659E4;--blue2:#3a7af0;--blue-dim:rgba(22,89,228,.08);

  /* Statuts */
  --green:#16a34a;--green-dim:rgba(22,163,74,.08);
  --amber:#d97706;--amber-dim:rgba(217,119,6,.08);
  --red:#dc2626;--red-dim:rgba(220,38,38,.07);
  --purple:#FA7B4E;--purple-dim:rgba(250,123,78,.1);

  /* Texte */
  --text:#0C2762;--text-muted:#3d5a8a;--text-dim:#8ea6c8;

  --sidebar:272px;
  --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:14.5px;line-height:1.7;}

/* ── SIDEBAR ─────────────────────────────────── */
#sidebar{
  width:var(--sidebar);height:100vh;background:#0C2762;
  border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;
  position:fixed;top:0;left:0;z-index:100;overflow-y:auto;
}
.sb-top{padding:20px 18px 16px;border-bottom:1px solid var(--border);}
.sb-brand{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6BE7DD;font-family:'Outfit',sans-serif;margin-bottom:3px;}
.sb-title{font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;color:#ffffff;line-height:1.3;}
.sb-prog-wrap{padding:12px 18px 14px;border-bottom:1px solid var(--border);}
.prog-row{display:flex;justify-content:space-between;font-size:10.5px;color:rgba(255,255,255,.45);margin-bottom:6px;}
.prog-track{height:2px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,#1659E4,#6BE7DD);border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.sb-nav{flex:1;padding:8px 10px 24px;}
.sb-section-lbl{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.25);padding:14px 8px 5px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:1px;transition:all .18s;border:1px solid transparent;}
.nav-item:hover{background:rgba(255,255,255,.07);}
.nav-item.active{background:rgba(22,89,228,.25);border-color:rgba(107,231,221,.3);}
.nav-dot{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;transition:all .3s;color:rgba(255,255,255,.45);}
.nav-item.active .nav-dot{border-color:#6BE7DD;color:#6BE7DD;}
.nav-item.done .nav-dot{background:#16a34a;border-color:#16a34a;color:#fff;}
.nav-item.done .nav-dot::after{content:'✓';}
.nav-text{flex:1;min-width:0;}
.nav-sub{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:rgba(255,255,255,.35);line-height:1;}
.nav-item.active .nav-sub{color:#6BE7DD;}
.nav-name{font-size:12px;font-weight:500;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-item.active .nav-name,.nav-item.done .nav-name{color:#ffffff;}

/* ── MAIN ────────────────────────────────────── */
#main{margin-left:var(--sidebar);flex:1;}
.page{max-width:740px;margin:0 auto;padding:44px 32px 100px;animation:fadeIn .35s ease;}

/* ── PAGE HEADER ──────────────────────────────── */
.mod-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(22,89,228,.07);border:1px solid rgba(22,89,228,.2);border-radius:20px;padding:3px 12px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--blue);margin-bottom:12px;}
.page-h1{font-family:'Outfit',sans-serif;font-size:32px;font-weight:900;line-height:1.15;margin-bottom:10px;background:linear-gradient(140deg,#0C2762 0%,#1659E4 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.page-sub{font-size:14.5px;color:var(--text-muted);max-width:580px;line-height:1.8;margin-bottom:36px;border-bottom:1px solid var(--border);padding-bottom:28px;}

/* ── SECTION ──────────────────────────────────── */
.sec{margin-bottom:28px;}
.sec-h{font-family:'Outfit',sans-serif;font-size:17px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.sec-h::before{content:'';width:3px;height:17px;background:var(--blue);border-radius:2px;flex-shrink:0;}
.prose{font-size:14px;color:var(--text-muted);line-height:1.9;}
.prose p{margin-bottom:12px;}
.prose p:last-child{margin-bottom:0;}
.prose strong,.prose b{color:var(--text);font-weight:500;}
.prose em{color:var(--blue2);}

/* ── CARDS ────────────────────────────────────── */
.card-row{display:grid;gap:8px;margin:4px 0;}
.card-row.c2{grid-template-columns:1fr 1fr;}
.card-row.c3{grid-template-columns:repeat(3,1fr);}
.card{background:#ffffff;border:1px solid rgba(12,39,98,.1);border-radius:var(--radius);padding:16px 18px;box-shadow:0 1px 4px rgba(12,39,98,.06);}
.card-ico{font-size:18px;margin-bottom:7px;}
.card-name{font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;color:var(--text);margin-bottom:5px;}
.card p{font-size:12.5px;color:var(--text-muted);line-height:1.7;}

/* ── HIGHLIGHTS ───────────────────────────────── */
.hl{border-radius:var(--radius);padding:16px 20px;margin-bottom:18px;border-left:3px solid;}
.hl.blue{background:var(--blue-dim);border-color:var(--blue);}
.hl.green{background:var(--green-dim);border-color:var(--green);}
.hl.amber{background:var(--amber-dim);border-color:var(--amber);}
.hl.red{background:var(--red-dim);border-color:var(--red);}
.hl.purple{background:var(--purple-dim);border-color:var(--purple);}
.hl-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px;}
.hl.blue .hl-label{color:var(--blue);}
.hl.green .hl-label{color:var(--green);}
.hl.amber .hl-label{color:var(--amber);}
.hl.red .hl-label{color:var(--red);}
.hl.purple .hl-label{color:var(--purple);}
.hl p,.hl-body{font-size:13.5px;line-height:1.85;color:var(--text-muted);}
.hl p strong,.hl-body strong{color:var(--text);}

/* ── SCENARIO ─────────────────────────────────── */
.scenario{background:#eef6ff;border:1px solid rgba(22,89,228,.15);border-radius:var(--radius);overflow:hidden;margin-bottom:22px;}
.scen-head{padding:9px 18px;background:rgba(22,89,228,.08);border-bottom:1px solid rgba(22,89,228,.12);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);}
.scen-body{padding:16px 20px;font-size:13.5px;color:var(--text-muted);line-height:1.85;}
.scen-body p{margin-bottom:9px;}
.scen-body p:last-child{margin-bottom:0;}

/* ── LIST ─────────────────────────────────────── */
.slist{list-style:none;margin:6px 0;}
.slist li{display:flex;align-items:flex-start;gap:8px;padding:7px 0;font-size:13.5px;color:var(--text-muted);border-bottom:1px solid rgba(255,255,255,.035);line-height:1.7;}
.slist li:last-child{border-bottom:none;}
.ldot{width:5px;height:5px;background:var(--blue);border-radius:50%;flex-shrink:0;margin-top:9px;}
.slist b{color:var(--text);font-weight:500;}

/* ── QUESTIONS ────────────────────────────────── */
.q-grid{display:grid;gap:6px;margin:10px 0;}
.q-item{background:#ffffff;border:1px solid rgba(12,39,98,.1);border-radius:8px;padding:10px 14px;font-size:13.5px;color:var(--text-muted);display:flex;align-items:flex-start;gap:8px;line-height:1.65;}
.q-ico{width:19px;height:19px;background:rgba(22,89,228,.08);color:#1659E4;border-radius:4px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}

/* ── MEDDPICC MAP ─────────────────────────────── */
.mmap{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px 0;}
.mm-item{background:#ffffff;border:1px solid rgba(12,39,98,.1);border-radius:var(--radius);padding:13px 8px;text-align:center;transition:all .18s;cursor:default;}
.mm-letter{font-family:'Outfit',sans-serif;font-size:24px;font-weight:900;color:var(--blue);line-height:1;margin-bottom:3px;}
.mm-word{font-size:9.5px;color:var(--text-dim);font-weight:500;line-height:1.3;}

/* ── RAG SCORING ──────────────────────────────── */
.rag{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0;}
.rag-c{border-radius:var(--radius);padding:13px;text-align:center;}
.rag-c.g{background:var(--green-dim);border:1px solid rgba(34,197,94,.2);}
.rag-c.a{background:var(--amber-dim);border:1px solid rgba(245,158,11,.2);}
.rag-c.r{background:var(--red-dim);border:1px solid rgba(248,113,113,.2);}
.rag-c.u{background:var(--bg3);border:1px solid var(--border);}
.rag-dot{width:16px;height:16px;border-radius:50%;margin:0 auto 6px;}
.rag-c.g .rag-dot{background:var(--green);}
.rag-c.a .rag-dot{background:var(--amber);}
.rag-c.r .rag-dot{background:var(--red);}
.rag-c.u .rag-dot{background:var(--text-dim);}
.rag-lbl{font-size:11px;font-weight:700;}
.rag-c.g .rag-lbl{color:var(--green);}
.rag-c.a .rag-lbl{color:var(--amber);}
.rag-c.r .rag-lbl{color:var(--red);}
.rag-c.u .rag-lbl{color:var(--text-dim);}
.rag-desc{font-size:10px;color:var(--text-dim);margin-top:3px;line-height:1.4;}

/* ── EXPANDABLE ───────────────────────────────── */
.expd{background:#ffffff;border:1px solid rgba(12,39,98,.1);border-radius:var(--radius);overflow:hidden;margin-bottom:6px;}
.expd-hdr{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--text);transition:background .15s;}
.expd-hdr:hover{background:#f0f4fb;}
.expd-arr{color:var(--text-dim);font-size:10px;transition:transform .3s;}
.expd.open .expd-arr{transform:rotate(180deg);}
.expd-body{max-height:0;overflow:hidden;transition:max-height .35s ease;}
.expd.open .expd-body{max-height:600px;}
.expd-inner{padding:13px 16px;border-top:1px solid var(--border);font-size:13.5px;color:var(--text-muted);line-height:1.85;}

/* ── TABLE ────────────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0;}
.tbl th{text-align:left;padding:8px 12px;background:#e8eef8;color:var(--text-muted);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;border-bottom:1px solid var(--border);}
.tbl td{padding:9px 12px;color:var(--text-muted);border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top;line-height:1.65;}
.tbl tr:hover td{background:var(--bg3);}

/* ── QUIZ ─────────────────────────────────────── */
.quiz-section{margin-top:48px;padding-top:32px;border-top:1px solid var(--border);}
.quiz-header{margin-bottom:24px;}
.quiz-header h2{font-family:'Outfit',sans-serif;font-size:19px;font-weight:700;margin-bottom:5px;}
.quiz-header p{color:var(--text-muted);font-size:13px;}
.qq{background:#ffffff;border:1.5px solid rgba(12,39,98,.1);border-radius:12px;padding:20px;margin-bottom:12px;transition:border-color .25s;box-shadow:0 1px 4px rgba(12,39,98,.05);}
.qq.ok{border-color:var(--green);}
.qq.ko{border-color:var(--red);}
.qq-num{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:6px;}
.qq-q{font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;color:var(--text);margin-bottom:14px;line-height:1.55;}
.qq-opts{display:grid;gap:6px;}
.qq-opt{background:#f0f4fb;border:1.5px solid rgba(12,39,98,.08);border-radius:8px;padding:10px 14px;font-size:13.5px;color:var(--text-muted);cursor:pointer;transition:all .18s;text-align:left;display:flex;align-items:center;gap:8px;font-family:'DM Sans',sans-serif;width:100%;}
.qq-opt:hover:not(:disabled){border-color:var(--blue);color:var(--text);background:var(--blue-dim);}
.qq-opt:disabled{cursor:default;}
.qq-opt.correct{border-color:var(--green);background:var(--green-dim);color:var(--text);}
.qq-opt.wrong{border-color:var(--red);background:var(--red-dim);color:var(--text);}
.qq-opt.reveal{border-color:var(--green);background:var(--green-dim);color:var(--text);}
.opt-badge{width:22px;height:22px;border-radius:5px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text-dim);flex-shrink:0;transition:all .2s;}
.correct .opt-badge{background:var(--green);color:#fff;}
.wrong .opt-badge{background:var(--red);color:#fff;}
.reveal .opt-badge{background:var(--green);color:#fff;}
.qq-expl{margin-top:10px;padding:11px 14px;background:var(--bg);border-radius:7px;border-left:3px solid var(--blue);font-size:13px;color:var(--text-muted);line-height:1.8;display:none;}
.qq-expl.show{display:block;animation:fadeIn .25s ease;}
.quiz-result{text-align:center;padding:28px;background:#ffffff;border-radius:12px;border:1px solid rgba(12,39,98,.1);margin-top:18px;animation:fadeIn .4s ease;}
.result-score{font-family:'Outfit',sans-serif;font-size:50px;font-weight:900;color:var(--blue);line-height:1;margin-bottom:5px;}
.result-lbl{color:var(--text-muted);font-size:13px;margin-bottom:20px;}

/* ── NAVIGATION BUTTONS ───────────────────────── */
.page-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:22px;border-top:1px solid var(--border);}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer;border:none;transition:all .18s;font-family:'DM Sans',sans-serif;}
.btn-p{background:var(--blue);color:#fff;}
.btn-p:hover{background:#0d40c2;transform:translateY(-1px);}
.btn-s{background:var(--bg3);color:var(--text-muted);border:1px solid var(--border);}
.btn-s:hover{color:var(--text);border-color:var(--blue);}

/* ── WELCOME PAGE ─────────────────────────────── */
.welcome-wrap{padding:52px 32px;max-width:660px;margin:0 auto;animation:fadeIn .5s ease;}
.w-label{display:inline-flex;align-items:center;gap:5px;background:rgba(22,89,228,.07);border:1px solid rgba(22,89,228,.2);border-radius:20px;padding:4px 13px;font-size:9.5px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.12em;margin-bottom:20px;}
.w-h1{font-family:'Outfit',sans-serif;font-size:40px;font-weight:900;line-height:1.1;margin-bottom:16px;background:linear-gradient(140deg,#0C2762 0%,#1659E4 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.w-desc{font-size:14.5px;color:var(--text-muted);line-height:1.85;margin-bottom:28px;max-width:520px;}
.w-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:28px;}
.stat-box{background:#ffffff;border:1px solid rgba(12,39,98,.1);border-radius:var(--radius);padding:14px;text-align:center;}
.stat-v{font-family:'Outfit',sans-serif;font-size:24px;font-weight:900;color:var(--blue);line-height:1;margin-bottom:4px;}
.stat-l{font-size:11px;color:var(--text-dim);}
.w-modules{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:28px;}
.wm-item{background:#ffffff;border:1px solid rgba(12,39,98,.1);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:flex-start;gap:11px;}
.wm-letter{font-family:'Outfit',sans-serif;font-size:22px;font-weight:900;color:var(--blue);width:28px;flex-shrink:0;line-height:1;}
.wm-text{}
.wm-name{font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px;}
.wm-desc{font-size:11.5px;color:var(--text-dim);line-height:1.5;}

/* ── SCORECARD MODULE ─────────────────────────── */
.sc-row{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.sc-row:last-child{border-bottom:none;}
.sc-l{font-family:'Outfit',sans-serif;font-size:20px;font-weight:900;color:var(--blue);text-align:center;padding-top:1px;}
.sc-content{}
.sc-content strong{font-size:13px;color:var(--text);font-weight:500;display:block;margin-bottom:2px;}
.sc-content span{font-size:12.5px;color:var(--text-muted);}
.sc-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:5px;font-size:10.5px;font-weight:700;white-space:nowrap;}
.sc-pill.g{background:var(--green-dim);color:var(--green);border:1px solid rgba(34,197,94,.2);}
.sc-pill.a{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(245,158,11,.2);}
.sc-pill.r{background:var(--red-dim);color:var(--red);border:1px solid rgba(248,113,113,.2);}
.sc-pill.u{background:var(--bg3);color:var(--text-dim);border:1px solid var(--border);}

/* ── ANIMATIONS ───────────────────────────────── */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── SCROLLBAR ────────────────────────────────── */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:#e8eef8;}
::-webkit-scrollbar-thumb{background:#b8c8e0;border-radius:2px;}

@media(max-width:768px){
  #sidebar{width:220px;}
  #main{margin-left:220px;}
  :root{--sidebar:220px;}
  .mmap{grid-template-columns:repeat(4,1fr);}
  .card-row.c3{grid-template-columns:1fr 1fr;}
  .page{padding:28px 18px 80px;}
}
@media(max-width:520px){
  #sidebar{transform:translateX(-100%);transition:transform .3s;}
  #sidebar.open{transform:none;}
  #main{margin-left:0;}
  .card-row.c2,.card-row.c3,.w-stats,.w-modules,.rag{grid-template-columns:1fr 1fr;}
}

/* ── CASE STUDY ───────────────────────────────────── */
.cs-wrap{background:#f8faff;border:1px solid rgba(12,39,98,.12);border-radius:var(--radius);overflow:hidden;margin-top:32px;}
.cs-head{background:linear-gradient(135deg,#0C2762 0%,#1659E4 100%);padding:14px 20px;color:#fff;font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;}
.cs-doc{padding:18px 20px;border-bottom:1px solid rgba(12,39,98,.1);font-size:13px;color:var(--text-muted);line-height:1.8;background:#fff;}
.cs-doc p{margin-bottom:8px;} .cs-doc p:last-child{margin-bottom:0;}
.cs-doc strong{color:var(--text);}
.cs-doc em{color:var(--text-muted);font-style:italic;}
.cs-doc hr{border:none;border-top:1px solid var(--border);margin:10px 0;}
.cs-qwrap{padding:16px 20px 20px;}
.cs-qtitle{font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);margin-bottom:14px;}
.cs-q{background:#fff;border:1px solid rgba(12,39,98,.1);border-radius:8px;padding:14px 16px;margin-bottom:10px;}
.cs-q .qq-num{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:6px;}
.cs-q .qq-q{font-size:13.5px;font-weight:500;color:var(--text);margin-bottom:12px;line-height:1.6;}
.cs-q .qq-opts{display:flex;flex-direction:column;gap:6px;}
.cs-q .qq-opt{text-align:left;background:#f7f9fd;border:1px solid rgba(12,39,98,.1);border-radius:6px;padding:9px 13px;font-size:13px;color:var(--text-muted);cursor:pointer;transition:all .15s;}
.cs-q .qq-opt:hover{background:#eef2fc;border-color:rgba(22,89,228,.25);}
.cs-q .qq-opt.correct{background:var(--green-dim);border-color:var(--green);color:var(--green);}
.cs-q .qq-opt.wrong{background:var(--red-dim);border-color:var(--red);color:var(--red);}
.cs-q .qq-opt.reveal{background:var(--green-dim);border-color:var(--green);color:var(--green);}

<script>
// ═══════════════════════ DATA ═══════════════════════

const MODULES = [
  // 0 — WELCOME
  { id:'welcome', nav:'Bienvenue', sub:'Commencer ici', welcome:true },

  // 1 — INTRO
  {
    id:'intro', nav:"Qu'est-ce que MEDDPICC ?", sub:'Module 1',
    badge:'Module 1', title:'MEDDPICC — La méthode des deals qui se closent',
    subtitle:"Comprendre l'origine, la philosophie et les 8 dimensions de la méthode qui structure les meilleures équipes commerciales B2B.",
    blocks:[
      {t:'prose',h:'Pourquoi les deals B2B échouent',p:`<p>Dans une vente B2B complexe — solutions IT, cloud, cybersécurité — le commercial passe des semaines à pitcher, faire des démos, envoyer des devis. Et puis rien. Le prospect « réfléchit encore ».</p><p>Ce n'est presque jamais un problème de produit. C'est un problème de <strong>qualification</strong>. Le commercial n'a pas compris comment la décision se prend réellement, qui a le pouvoir de signer, ou si la douleur est suffisamment forte pour justifier un changement.</p><p><strong>MEDDPICC est la réponse.</strong> Un cadre de qualification conçu pour les ventes B2B complexes : plusieurs interlocuteurs, comité de décision, étapes techniques et juridiques.</p>`},
      {t:'hl',v:'blue',lbl:'Définition',body:`<strong>MEDDPICC</strong> est un acronyme : <strong>M</strong>etrics · <strong>E</strong>conomic Buyer · <strong>D</strong>ecision Criteria · <strong>D</strong>ecision Process · <strong>P</strong>aper Process · <strong>I</strong>dentify Pain · <strong>C</strong>hampion · <strong>C</strong>ompetition. Chaque lettre représente une dimension critique à qualifier pour maximiser ses chances de closing.`},
      {t:'mmap'},
      {t:'prose',h:'Histoire : de MEDDIC à MEDDPICC',p:`<p>La méthode est née chez <strong>PTC</strong> dans les années 1990 sous le nom <strong>MEDDIC</strong>. Avec le temps : MEDDIC → MEDDICC → MEDDPICC. Le <strong>P</strong> (Paper Process) a été ajouté quand les équipes ont réalisé que des deals bien qualifiés glissaient à cause de processus d'approbation non anticipés.</p><p>Aujourd'hui utilisé dans la majorité des grandes organisations B2B tech — et de plus en plus dans les ESN du secteur IT.</p>`},
      {t:'hl',v:'amber',lbl:'⚠️ Règle fondamentale',body:`<strong>Zéro supposition.</strong> Si une information n'est pas vérifiée, elle reste <strong>inconnue</strong> — et devient une action d'investigation datée. Les forecasts basés sur des suppositions créent des surprises de closing.`},
      {t:'prose',h:'Le système de scoring RAG',p:`<p>Chaque dimension de MEDDPICC est évaluée avec un code couleur simple :</p>`},
      {t:'rag'},
      {t:'prose',h:'MEDDPICC dans votre contexte',p:`<p>Votre entreprise vend des solutions IT aux PME. Ce contexte a des spécificités :<br>— Le budget est souvent limité → les <strong>Metrics</strong> (ROI, coût d'inaction) sont décisifs.<br>— L'<strong>Economic Buyer</strong> est souvent le DG, parfois le DAF.<br>— Le <strong>Champion</strong> est souvent le DSI — mais n'a pas toujours accès au budget.<br>— Le <strong>Paper Process</strong> peut surprendre : expert-comptable, avocat, clauses RGPD.</p>`},
      {t:'scenario',lbl:'🏭 Scénario fil rouge — NovaCorp',p:`<p><strong>NovaCorp</strong> est une PME industrielle de 180 employés à Lyon, fabrication de composants électroniques. Infra : 3 serveurs on-premise vieillissants, backup locale, postes Windows 10 dont le support arrive à expiration.</p><p>Le DSI, <strong>Julien Martel</strong>, a contacté votre ESN. Il est enthousiaste, technique, curieux. Mais qui d'autre est impliqué ? Quel est le vrai problème business ? Qui signe ? C'est ce que MEDDPICC va t'aider à découvrir.</p>`}
    ],
    quiz:[
      {q:"Que représente fondamentalement MEDDPICC ?",opts:["Un outil CRM pour gérer les contacts","Un cadre de qualification d'opportunités B2B complexes","Un script de vente à suivre mot pour mot","Une méthode de prospection à froid"],c:1,e:"MEDDPICC est un cadre de qualification — il aide à comprendre si un deal est réellement qualifié et comment maximiser les chances de le closer. Ce n'est pas un script ni un outil CRM."},
      {q:"Que doit-on faire si une information MEDDPICC n'est pas vérifiée ?",opts:["Estimer à partir de l'attitude du prospect","La laisser 'inconnue' et en faire une action d'investigation datée","Marquer 'qualifié' pour ne pas bloquer le pipeline","Combler avec des benchmarks sectoriels"],c:1,e:"La règle 'zéro supposition' est centrale. Si tu n'as pas de preuve, la dimension reste inconnue — et devient une action à mener avec un owner et une date."},
      {q:"Pourquoi le 'P' (Paper Process) a-t-il été ajouté à MEDDIC ?",opts:["Les contrats nécessitent une signature physique","La conformité RGPD l'a rendu obligatoire","Le PDF est devenu le format standard","Des deals bien qualifiés échouaient à cause du processus d'approbation non anticipé"],c:3,e:"Le P a été intégré car des deals bien qualifiés sur MEDDIC échouaient quand même — non parce que le client ne voulait pas acheter, mais parce que le chemin vers la signature n'avait pas été anticipé."},
      {q:"MEDDPICC s'applique uniquement aux deals supérieurs à 100 000€. Vrai ou faux ?",opts:["Vrai — en dessous ce n'est pas utile","Vrai — sauf pour les renouvellements","Faux — mais seulement en SaaS et cloud","Faux — MEDDPICC est pertinent dès qu'il y a plusieurs interlocuteurs et un processus de décision"],c:3,e:"MEDDPICC s'applique dès qu'une vente implique plusieurs décisionnaires et un cycle de qualification. En PME IT, même un deal de 15 000€ peut avoir un EB, un champion, un Paper Process et des critères cachés."},
      {q:"Laquelle de ces affirmations sur le scoring RAG est FAUSSE ?",opts:["Rouge signifie un risque non qualifié","Orange signifie que la dimension est partiellement qualifiée","Une dimension verte n'a plus jamais besoin d'être revérifiée","Inconnu exige une action datée"],c:2,e:"FAUX. Même une dimension verte doit être surveillée. Les situations évoluent — un champion peut partir, un critère peut changer. MEDDPICC est une inspection permanente, pas une checklist figée."},
      {q:"Un commercial a de solides Metrics et un Champion enthousiaste, mais n'a jamais rencontré l'Economic Buyer. Ce deal est :",opts:["Bien qualifié si le Champion confirme l'accord de l'EB","Solide — Metrics et Champion suffisent","À risque — l'EB peut tuer le deal sans que personne ne puisse l'influencer","En bonne voie — il reste juste à organiser une réunion EB"],c:2,e:"Sans accès à l'EB, le deal est fragile peu importe la qualité du reste. L'EB peut décider de ne pas signer pour des raisons que tu n'as jamais eu l'occasion d'adresser."}
    ],
    caseStudy:{
      label:"📋 Étude de cas — Le deal Orbis",
      doc:`<p><strong>Source :</strong> Note CRM — Commercial : Marc D. — Semaine 6</p><hr style="border:none;border-top:1px solid var(--border);margin:10px 0"><p><em>"Orbis Technologies, 120 personnes, distribution. Contact : Romain Ferré, DSI. 4 réunions depuis 6 semaines. Romain est très engagé, répond vite, bien aligné techniquement. Il m'a dit vouloir migrer leur infra d'ici fin d'année.</em></p><p><em>J'ai présenté notre offre cloud la semaine dernière. Romain a dit que c'était exactement ce qu'il fallait. Je pense que ce deal est quasi signé. Probabilité : 85%."</em></p>`,
      questions:[
        {q:"Combien de dimensions MEDDPICC sont réellement qualifiées dans cette note CRM ?",opts:["7 — il manque juste la proposition","5 à 6 — Romain est engagé et aligné","3 — Metrics, EB et Pain sont clairs","2 au maximum — Champion partiel et vague intention"],c:3,e:"En lisant attentivement : aucune Metric chiffrée, EB non identifié, pas de Decision Criteria formels, pas de Decision Process cartographié, pas de Paper Process, douleur floue. Ce deal est sur du sable malgré l'enthousiasme."},
        {q:"Marc estime la probabilité à 85%. Sur quoi repose réellement cette estimation ?",opts:["Sur le fait que Romain ait dit que c'était exactement ce qu'il fallait","Sur rien de qualifié — c'est une impression, pas une qualification MEDDPICC","Sur 4 réunions et une démo acceptée","Sur l'engagement de Romain et son alignement technique"],c:1,e:"85% basé sur l'enthousiasme d'un contact technique n'est pas une qualification. Sans EB identifié, sans Metrics, sans Decision Process, ce deal peut s'effondrer à n'importe quel moment."},
        {q:"Quelle est l'action MEDDPICC la plus urgente avant d'envoyer la proposition ?",opts:["Envoyer la proposition rapidement pour profiter de l'élan","Demander à Romain de signer un bon de commande informel","Identifier qui est l'Economic Buyer et obtenir une réunion avec lui","Ajouter plus de détails techniques à la proposition"],c:2,e:"Envoyer une proposition sans avoir rencontré l'EB, c'est risquer de travailler pendant encore 4 semaines pour se faire dire non par quelqu'un qu'on n'a jamais rencontré."}
      ]
    }
  },

  // 2 — METRICS
  {
    id:'metrics', nav:'Metrics', sub:'M — Module 2',
    badge:'M — Metrics', title:'M — Metrics',
    subtitle:"Ancrer la vente dans des résultats business mesurables. Sans chiffre, il n'y a pas de deal — il y a une conversation intéressante.",
    blocks:[
      {t:'prose',h:'Définition',p:`<p>Les <strong>Metrics</strong> sont les résultats business mesurables qui justifient l'investissement : combien ta solution fait gagner, économiser, ou quel risque elle élimine — avec des chiffres précis.</p><p>La formule : <strong>Baseline → Cible → Delta → Valeur €</strong>. Où en est le client ? Où veut-il aller ? Quelle est la différence ? Combien vaut cette différence ?</p>`},
      {t:'hl',v:'blue',lbl:'Formule clé',body:`<strong>Valeur = (Baseline − Cible) × Unité × Horizon</strong><br><br>Exemple : "Vos serveurs tombent en panne <strong>3 fois/an</strong> → vous visez <strong>0 panne critique</strong>. Chaque panne coûte <strong>8 000€</strong>. Sur 3 ans : <strong>72 000€ de valeur identifiée</strong>."`},
      {t:'cards',n:3,cards:[{ico:'💰',name:'Financières',p:"Réduction de coûts (licences, maintenance, heures IT), augmentation de CA, amélioration de marge, retour sur investissement."},{ico:'⚙️',name:'Opérationnelles',p:"Temps de traitement réduit, disponibilité améliorée, tickets divisés, déploiement raccourci, productivité des équipes."},{ico:'🛡️',name:'Risques / Stratégiques',p:"Conformité réglementaire (RGPD, ISO 27001), réduction du risque cyber, continuité d'activité, capacité à scaler."}]},
      {t:'prose',h:"Le coût d'inaction : l'arme secrète",p:`<p>La métrique la plus puissante n'est pas la valeur de ta solution — c'est le <strong>coût d'inaction</strong> : combien coûte le fait de <em>ne rien faire</em> ? Chaque mois, le client perd-il de l'argent, risque-t-il une pénalité, s'expose-t-il à un incident ?</p><p>Quand tu quantifies ça, tu ne vends plus une solution — tu aides le client à comprendre qu'il <strong>perd déjà de l'argent</strong>. Le statu quo devient l'ennemi, pas ton concurrent.</p>`},
      {t:'hl',v:'amber',lbl:'⚠️ Erreurs courantes',body:`<strong>1. Métriques génériques</strong> — "Vous allez gagner en productivité" ne vaut rien sans chiffre. "Vous économisez 14h/semaine à votre équipe IT = 18 000€/an" est une métrique.<br><br><strong>2. Inventer les chiffres</strong> — Les métriques doivent venir du client. Un ROI inventé sera challengé et détruira ta crédibilité.<br><br><strong>3. Ne pas lier à l'EB</strong> — Une métrique technique n'a de valeur que reliée à une priorité de l'Economic Buyer.`},
      {t:'questions',h:'Questions pour découvrir les métriques',qs:["Quels sont vos objectifs business prioritaires pour cette année ?","Comment mesurez-vous la performance de votre infrastructure aujourd'hui ?","Combien vous coûte une heure d'interruption de service ?","Quels indicateurs regardez-vous chaque semaine / chaque mois ?","Si on résout ce problème, quel impact attendez-vous dans 12 mois ?","Quelle est la valeur de ce projet si vous dépassez les objectifs ?"]},
      {t:'scenario',lbl:'🏭 NovaCorp — Découverte des métriques',p:`<p>Après une première réunion avec Julien, tu as découvert que l'infra tombe en panne <strong>3 fois/an</strong>, avec des interruptions de 4 à 6h. À 200€/h de perte de production, chaque panne coûte ~<strong>1 000€</strong> directement.</p><p>Surtout : NovaCorp a un client grand compte qui exige désormais un <strong>SLA de 99,5%</strong> — sous peine de pénalités contractuelles de <strong>5 000€/incident</strong>. L'infra actuelle ne peut pas garantir ce SLA.</p><p>⚠️ <strong>Lacune :</strong> Ces chiffres viennent du DSI. Ont-ils été validés par la DG (EB) ? Elle doit partager cette lecture du risque pour que les métriques aient un poids décisionnel réel.</p>`}
    ],
    quiz:[
      {q:"Un prospect te dit : 'Avec votre solution on va gagner en efficacité.' Quelle est la bonne réaction ?",opts:["Confirmer et avancer — 'efficacité' est une bonne métrique","Proposer un chiffre basé sur des benchmarks sectoriels","Quantifier : 'Qu'est-ce que ça représente concrètement en heures ou en euros ?'","Attendre le devis pour chiffrer"],c:2,e:"'Efficacité' est une aspiration, pas une métrique. Une métrique répond à : combien ? en combien de temps ? mesuré comment ? Il faut creuser pour obtenir un chiffre co-construit."},
      {q:"Quelle est la métrique la plus percutante pour créer l'urgence chez un Economic Buyer ?",opts:["Le coût d'inaction : ce que lui coûte le fait de ne rien faire","Le ROI sur 5 ans","La liste des fonctionnalités","Le temps d'implémentation estimé"],c:0,e:"Le coût d'inaction crée l'urgence. Le client se demande non plus 'combien coûte votre solution' mais 'combien me coûte le fait de ne pas agir'. Particulièrement puissant en IT où le statu quo est souvent le premier concurrent."},
      {q:"Dans NovaCorp, quelle lacune reste à combler sur les métriques ?",opts:["Il faut davantage chiffrer le coût des pannes","Il faut ajouter des métriques opérationnelles","Les métriques viennent du DSI — elles n'ont pas encore été validées par la DG (EB)","Les métriques sont complètes"],c:2,e:"Le DSI valide techniquement, mais l'EB (DG) doit partager cette lecture du risque. Si les métriques ne sont connues que du champion technique, elles n'ont pas de poids dans la décision finale."},
      {q:"Un prospect dit : 'Chaque heure d'arrêt nous coûte environ 500€.' Est-ce une métrique qualifiée ?",opts:["Non — 500€ c'est trop faible pour créer de l'urgence","Oui — c'est chiffré, c'est suffisant","Pas encore — il faut valider la fréquence et confirmer que ce chiffre est partagé par l'EB","Oui si le DSI l'a confirmé"],c:2,e:"Un chiffre sans fréquence ni horizon ne permet pas de calculer la valeur totale. 500€/h × 0 pannes/an = 0€. Il faut compléter : combien d'incidents par an, quelle durée moyenne, et l'EB partage-t-il cette évaluation ?"},
      {q:"Laquelle de ces approches est la PLUS efficace pour co-construire une métrique ?",opts:["Demander au prospect ses propres chiffres, puis construire ensemble le calcul de valeur","Utiliser des benchmarks sectoriels comme référence","Présenter un ROI calculé en interne avant la réunion","Attendre que le prospect mentionne spontanément ses objectifs financiers"],c:0,e:"Les métriques co-construites ont beaucoup plus de poids. Si c'est le client qui dit 'on perd 40 000€ par an', cette affirmation ne peut pas être challengée lors du comité de décision."},
      {q:"Un DSI partage des métriques détaillées mais son DG n'en a jamais entendu parler. Comment évalues-tu ces métriques dans le scoring RAG ?",opts:["Vertes si elles sont chiffrées et documentées","Rouges — les métriques du DSI sont toujours biaisées","Orange — techniquement valides, mais non validées par l'EB","Vertes — le DSI est le mieux placé pour évaluer l'impact"],c:2,e:"Des métriques valides techniquement mais non partagées par l'EB sont orange. L'EB peut avoir des priorités différentes — le DSI voit l'impact IT, le DG voit l'impact business et financier. Les deux lectures doivent s'aligner."}
    ],
    caseStudy:{
      label:"📋 Étude de cas — L'email post-démo",
      doc:`<p><strong>Source :</strong> Email reçu — Florent Masson, DSI — Groupe Altim (PME logistique, 95 personnes)</p><hr style="border:none;border-top:1px solid var(--border);margin:10px 0"><p><em>"Merci pour la présentation de jeudi. Votre solution correspond bien à ce que nous cherchons. Nous souhaitons améliorer notre infrastructure pour gagner en performance et en fiabilité — nos équipes se plaignent régulièrement de lenteurs, surtout en fin de journée.</em></p><p><em>Notre budget n'est pas encore défini mais on cherche quelque chose de raisonnable. Pourriez-vous nous préparer une proposition commerciale ?"</em></p>`,
      questions:[
        {q:"Avez-vous des Metrics qualifiées pour construire une proposition ?",opts:["Oui si vous calculez vous-même un ROI estimé","Oui — Florent a décrit le problème de lenteurs","Oui — l'intention est claire","Non — aucune métrique chiffrée, aucun baseline ni cible mesurable"],c:3,e:"Lenteurs en fin de journée est un symptôme, pas une métrique. Combien d'utilisateurs impactés ? Combien d'heures perdues ? Quel coût business ? Sans ces chiffres, votre proposition sera perçue comme une dépense, pas un investissement."},
        {q:"Florent demande une proposition 'rapidement'. Que faites-vous ?",opts:["Envoyez une proposition générique avec plusieurs options de prix","Envoyez la proposition dès que possible","Demandez une lettre d'intention","Demandez un call de 20 min avant pour qualifier Metrics, EB et budget"],c:3,e:"Envoyer une proposition sans Metrics, sans EB identifié et avec 'budget non défini' c'est travailler des heures pour produire un document qui ne peut pas être validé."},
        {q:"'Budget non défini' — quelle question posez-vous à Florent ?",opts:["Quel est votre budget maximum ?","Pouvons-nous faire une offre à 30 000€ ?","Pour calibrer notre proposition, avez-vous une idée de l'enveloppe envisagée pour ce type de projet ? Et qui valide ce budget ?","Nous enverrons plusieurs options à différents niveaux de prix"],c:2,e:"Deux infos manquent : le montant approximatif ET qui valide ce budget (l'EB). La question combinée permet de découvrir les deux sans paraître intrusif."}
      ]
    }
  },

  // 3 — ECONOMIC BUYER
  {
    id:'eb', nav:'Economic Buyer', sub:'E — Module 3',
    badge:'E — Economic Buyer', title:'E — Economic Buyer',
    subtitle:"Identifier et accéder à la personne qui a le pouvoir final de dire oui — et de dire non.",
    blocks:[
      {t:'prose',h:'Définition',p:`<p>L'<strong>Economic Buyer</strong> (EB) est la personne — ou le groupe — qui possède l'autorité finale pour approuver la dépense et signer. Ce n'est pas forcément celle qui utilise la solution. C'est celle qui peut <strong>"signer ou tuer"</strong> le deal.</p><p>Dans une PME, l'EB est souvent le DG. Dans des structures plus grandes, le DAF ou un comité. La clé : ce n'est pas un titre, c'est une <strong>autorité réelle</strong>.</p>`},
      {t:'hl',v:'blue',lbl:'Règle clé',body:`L'EB peut déléguer l'évaluation technique, mais ne délègue <strong>jamais</strong> la décision finale. Si quelqu'un te dit "la décision appartient au DSI", creuse toujours : <em>"Et le DG, quel est son rôle dans cette décision ?"</em>`},
      {t:'cards',n:2,cards:[{ico:'🏢',name:'Dans une PME (contexte ESN typique)',p:"Souvent le Directeur Général. Parfois le DAF si décision budgétaire importante. Rarement le DSI seul — sauf si délégation explicite confirmée."},{ico:'🏭',name:'Dans une ETI / grande entreprise',p:"Comité IT, DSI + DAF, ou COMEX selon le montant. Souvent plusieurs personnes pensent être l'EB, mais une seule a vraiment le dernier mot."}]},
      {t:'prose',h:"Comment accéder à l'EB",p:`<p>La meilleure approche : faire demander l'accès par ton <strong>Champion</strong>. "Est-ce qu'il serait possible d'avoir 20 minutes avec le DG pour valider que notre approche est alignée avec ses priorités avant d'aller plus loin ?"</p><p>Si le champion ne peut pas organiser ça, c'est un signal faible sur sa solidité. Un vrai champion a de l'accès et de l'influence.</p>`},
      {t:'hl',v:'amber',lbl:"⚠️ La fatigue de l'EB",body:`Ne sur-sollicite pas l'EB avec des questions de découverte basiques. Quand tu as une réunion avec l'EB, tu arrives <strong>préparé</strong> : tu connais déjà le problème, tu as des hypothèses de valeur, tu viens valider et aligner — pas faire une discovery from scratch.`},
      {t:'questions',h:"Questions pour qualifier l'EB",qs:["Qui prend la décision finale sur un projet de cette taille ?","Qui possède le budget pour ce type d'investissement ?","Vous m'avez parlé du DSI — quel est le rôle du DG dans cette décision ?","Y a-t-il d'autres personnes qui devront valider avant que le projet démarre ?","Quand vous avez pris une décision similaire par le passé, comment ça s'est passé ?"]},
      {t:'expd',items:[{h:"🚨 Signal d'alarme : 'C'est moi qui décide'",c:"Si quelqu'un te dit spontanément 'c'est moi qui décide', creuse toujours. Cette personne est parfois sincère — mais dans d'autres cas elle protège son accès alors que la vraie décision se prend ailleurs. Réponse idéale : 'Super. Et dans le processus d'approbation finale, y a-t-il d'autres signatures nécessaires ?' Tu poses la question sans challenger son autorité."},{h:"🏆 Tester ton Champion",c:"Demande au champion d'organiser une réunion avec l'EB. Sa capacité à y arriver (ou non) est un test direct de son influence réelle. Un champion qui dit 'je ne peux pas faire ça' n'est pas un vrai champion — c'est un contact interne."}]},
      {t:'scenario',lbl:"🏭 NovaCorp — Identifier l'EB",p:`<p>Julien mentionne en passant : <em>"Le DG, Sophie Renard, devra valider le budget — on parle de 45 000€ HT."</em></p><p><strong>Sophie Renard, DG de NovaCorp, est l'Economic Buyer.</strong> Julien est le champion technique, pas l'EB.</p><p>⚠️ <strong>Problème :</strong> Tu n'as jamais rencontré Sophie. Elle verra ce projet uniquement sous l'angle financier et risque.<br>✅ <strong>Action :</strong> Demander à Julien d'organiser une réunion de "validation stratégique" avec Sophie — pas une réunion commerciale.</p>`}
    ],
    quiz:[
      {q:"Le DSI de NovaCorp te dit : 'Pour 45 000€, c'est la DG qui signe.' Que fais-tu en priorité ?",opts:["Demander au DSI d'organiser une réunion avec la DG","Attendre que le DSI transmette la proposition","Envoyer une proposition directement à la DG par email","Continuer uniquement avec le DSI pour ne pas court-circuiter"],c:0,e:"Accéder à l'EB est non-négociable. Attendre ou espérer que le champion transmette bien le message est risqué — le deal est vulnérable tant que l'EB ne t'a pas rencontré."},
      {q:"Quel est le principal risque si tu n'accèdes jamais à l'Economic Buyer ?",opts:["La démo ne peut pas avoir lieu","Le deal peut être tué à n'importe quel moment par une décision que tu n'as pas eu la chance d'influencer","Le contrat prendra plus de temps","La mise en oeuvre sera plus complexe"],c:1,e:"Sans accès à l'EB, tu es entièrement dépendant de ton champion. L'EB peut décider de ne pas signer pour des raisons que tu n'as jamais eu l'occasion d'adresser. C'est la cause principale des deals qui 'meurent en silence'."},
      {q:"Quand est le bon moment pour rencontrer l'Economic Buyer ?",opts:["Le plus tôt possible, dès que la douleur et les métriques sont identifiées","Seulement si le champion l'invite spontanément","Uniquement lors de la remise de la proposition","Le plus tard possible"],c:0,e:"Idéalement, tu rencontres l'EB dès que tu as des éléments solides sur la douleur et la valeur potentielle. Attendre la proposition expose à un risque majeur : l'EB peut invalider tout le travail en 10 minutes si ses priorités ne sont pas alignées."},
      {q:"Un contact te dit spontanément : 'Je suis le seul décisionnaire ici.' Que fais-tu ?",opts:["Le croire — il connaît son organisation mieux que toi","Court-circuiter et contacter le DG directement","Ignorer et avancer sur la proposition","Creuser avec tact : 'Et pour un engagement de cette taille, y a-t-il d'autres validations nécessaires ?'"],c:3,e:"Ce signal doit toujours être challengé avec tact. Parfois vrai, parfois faux — la question 'y a-t-il d'autres validations ?' ne remet pas en cause son autorité et permet de vérifier si l'affirmation est exacte."},
      {q:"L'EB vous accorde 20 minutes. Comment préparez-vous cette réunion ?",opts:["Arriver avec les hypothèses de valeur construites avec le champion, venir valider et aligner","Recommencer la discovery depuis zéro","Envoyer une présentation de 20 slides en préparation","Présenter l'ensemble de votre offre pour maximiser le temps"],c:0,e:"L'EB n'a pas le temps pour une discovery from scratch. Vous arrivez préparé : problème connu, métriques à valider, alignement stratégique à confirmer. Respecter son temps est crucial."},
      {q:"Votre Champion vous dit qu'il ne peut pas organiser de réunion avec l'EB car 'le DG est très occupé'. Que révèle cela ?",opts:["Que le DG est effectivement occupé — il faut patienter","Qu'il faut attendre la fin du trimestre","Que le deal n'est pas prioritaire","Un signal sur la qualité du Champion — un vrai champion trouve un moyen d'accéder à l'EB"],c:3,e:"L'incapacité à organiser l'accès à l'EB est un test de qualité du champion. Un champion réel a de l'influence et de l'accès. S'il bloque cet accès, il n'a peut-être pas l'influence qu'il prétend."}
    ],
    caseStudy:{
      label:"📋 Étude de cas — 'C'est moi qui décide'",
      doc:`<p><strong>Source :</strong> Compte-rendu d'appel — Antoine L. — Prospect : Stéphane Blanc, DSI — Geodis Parts (140 personnes)</p><hr style="border:none;border-top:1px solid var(--border);margin:10px 0"><p><strong>Antoine :</strong> <em>"Pour un projet de cette envergure, environ 55 000€, qui prend la décision finale ?"</em></p><p><strong>Stéphane :</strong> <em>"C'est moi qui gère tout le SI. Le DG me fait entièrement confiance, je décide de mes outils."</em></p><p><strong>Antoine :</strong> <em>"Et pour le budget, c'est vous qui l'allouez ?"</em></p><p><strong>Stéphane :</strong> <em>"Oui, j'ai une enveloppe annuelle. Bon, pour 55 000€, je devrai quand même en parler à Martine (DG) mais c'est une formalité, elle valide toujours mes choix."</em></p><p><strong>Antoine :</strong> <em>"Très bien. Je vous prépare la proposition."</em></p>`,
      questions:[
        {q:"Antoine a-t-il correctement identifié l'Economic Buyer ?",opts:["Oui — une formalité n'est pas une vraie décision","Non — Stéphane lui-même a révélé que Martine (DG) doit valider 55 000€","Impossible à dire","Oui — Stéphane a confirmé qu'il gère le SI et a le budget"],c:1,e:"Stéphane a dit lui-même 'je devrai en parler à Martine'. Pour 55 000€, si le DG valide, le DG est l'EB. Une validation 'formalité' peut se transformer en blocage si Martine a des contraintes inconnues."},
        {q:"Quelle aurait dû être la prochaine action d'Antoine ?",opts:["Attendre la décision de Stéphane","Envoyer la proposition à Stéphane rapidement","Demander à Stéphane d'organiser une réunion avec Martine avant d'envoyer la proposition","Contacter Martine directement par email"],c:2,e:"Antoine doit rencontrer Martine avant de finaliser la proposition. Sans accès à l'EB réelle, la proposition risque d'arriver à quelqu'un qui n'a pas le pouvoir de la signer."},
        {q:"'Martine valide toujours mes choix' — comment interpréter cette affirmation ?",opts:["Preuve que Stéphane est bien l'EB","C'est le point de vue de Stéphane — Martine peut avoir des priorités différentes qu'il ne connaît pas","Raison de ne pas impliquer Martine inutilement","C'est une garantie que le deal est quasi signé"],c:1,e:"L'historique passé ne garantit pas la décision présente. Martine peut avoir des contraintes budgétaires ce trimestre ou une vision différente du risque cloud. Son alignement doit être vérifié directement."}
      ]
    }
  },

  // 4 — DECISION CRITERIA
  {
    id:'dc', nav:'Decision Criteria', sub:'D — Module 4',
    badge:'D — Decision Criteria', title:'D — Decision Criteria',
    subtitle:"Comprendre exactement comment le client va choisir — et s'assurer que les critères jouent en ta faveur.",
    blocks:[
      {t:'prose',h:'Définition',p:`<p>Les <strong>Decision Criteria</strong> sont les critères utilisés pour évaluer les options. Ils peuvent être explicites (grille formelle) ou implicites (priorités non verbalisées). Les maîtriser, c'est comprendre le "scorecard" mental du client — et l'influencer.</p><p>Dans une vente IT/cloud, les critères typiques : technique (compatibilité, sécurité), financier (prix, ROI, TCO), relationnel (confiance, références, support), et risque (réversibilité, conformité).</p>`},
      {t:'cards',n:2,cards:[{ico:'📝',name:'Critères explicites',p:"Le client a formalisé ses critères (RFP, grille d'évaluation, specs techniques). Tu les connais parce qu'il te les a communiqués formellement."},{ico:'💭',name:'Critères implicites',p:"Priorités non verbalisées : 'On préfère un fournisseur français', 'Le DG est sensible à la simplicité'. Souvent plus décisifs que les critères formalisés."}]},
      {t:'hl',v:'green',lbl:'💡 Avantage stratégique',body:`Les Decision Criteria peuvent être <strong>influencés</strong>. Si tu les découvres tôt, tu peux aider le client à les formuler — en mettant en avant ceux sur lesquels tu excelles. Ce n'est pas de la manipulation : c'est aider le client à structurer sa décision de façon éclairée.`},
      {t:'prose',h:'Les critères cachés à détecter',p:`<p>Dans la vente IT aux PME, certains critères ne sont jamais exprimés spontanément mais peuvent tuer un deal :</p>`},
      {t:'list',items:[{b:'Sécurité & conformité',t:" — RGPD, ISO 27001, hébergement en France. De plus en plus présent même en PME."},{b:'Support en français',t:" — Un support uniquement en anglais peut être rédhibitoire."},{b:'Intégration ERP',t:" — Si la solution ne s'intègre pas avec leur outil de gestion, le projet est mort."},{b:'Réversibilité',t:" — 'Peut-on facilement sortir ?' La peur du lock-in est réelle en PME."},{b:'Référence sectorielle',t:" — 'Avez-vous des clients dans notre secteur ?' Question qui revient souvent."}]},
      {t:'questions',h:'Questions pour découvrir les critères',qs:["À quoi ressemblerait la solution idéale pour vous ?","Quels sont vos critères prioritaires pour choisir entre les options ?","Y a-t-il des critères techniques non-négociables ?","Comment allez-vous calculer le ROI de ce projet en interne ?","Y a-t-il des contraintes réglementaires ou de sécurité à respecter ?","Quelles ont été les raisons du choix de votre fournisseur actuel ?"]},
      {t:'scenario',lbl:'🏭 NovaCorp — Cartographie des critères',p:`<p>Critères explicites identifiés :<br>✅ Hébergement des données en France (obligation contractuelle client grand compte)<br>✅ SLA minimum 99,5%<br>✅ Support réactif en français<br>✅ Intégration ERP (Sage 100)<br>✅ Budget maximum : 50 000€ HT</p><p>Lors d'un déjeuner informel, Julien mentionne : <em>"La DG est très sensible à la simplicité — elle ne veut pas d'un outil qui nécessite une formation de 3 mois."</em></p><p>⚠️ <strong>Critère implicite détecté :</strong> simplicité d'adoption. Ce critère devra être mis en avant dans ta proposition et ta démo — sans que la DG ait eu à le formuler explicitement.</p>`}
    ],
    quiz:[
      {q:"NovaCorp exige l'hébergement des données en France (obligation contractuelle). Comment catégorises-tu ce critère ?",opts:["Critère technique, pas besoin de le remonter à la DG","Critère secondaire à traiter dans les annexes","Critère négociable si on propose une garantie contractuelle","Critère non-négociable à valider immédiatement — deal-breaker potentiel"],c:3,e:"Un critère lié à une obligation contractuelle est absolu. Si tu ne peux pas héberger en France, le deal est mort peu importe les autres avantages. À qualifier immédiatement."},
      {q:"Un concurrent propose une solution moins chère. Comment utilises-tu les Decision Criteria ?",opts:["Attaquer directement la solution concurrente","Ignorer le concurrent","Identifier les critères sur lesquels tu excelles et aider le client à mieux les pondérer","Réduire ton prix pour t'aligner"],c:2,e:"Si le prix est le seul critère, la vente se perd toujours sur le prix. Ton rôle : aider le client à comprendre que support FR, intégration ERP, SLA garanti ont une valeur qui justifie un delta de prix."},
      {q:"Un prospect n'a pas de grille d'évaluation formelle. A-t-il des Decision Criteria ?",opts:["Non, mais les critères implicites ne sont pas importants","Non — sans grille formelle, les critères n'existent pas","Oui, mais ils se résument toujours au prix en PME","Oui — l'absence de grille signifie qu'il faut les découvrir par des questions"],c:3,e:"Les critères implicites sont souvent plus décisifs. L'absence de grille est fréquente en PME — ce n'est pas un signal que les critères n'existent pas, c'est une opportunité de les découvrir et de les influencer."},
      {q:"Quel est l'avantage stratégique de découvrir les Decision Criteria AVANT de pitcher ?",opts:["Aucun avantage particulier — les critères sont fixes","Vous pouvez aider le client à formuler ses critères en mettant en avant ceux sur lesquels vous excellez","Vous préparez une réponse technique plus précise","Vous éliminez les concurrents dès le départ"],c:1,e:"Les critères découverts tôt peuvent être influencés. Si vous savez que le client valorise la réversibilité et que c'est un de vos points forts, vous pouvez l'aider à pondérer ce critère davantage — légitimement."},
      {q:"Un DG dit en passant : 'On a eu un gros problème de support avec notre ancien prestataire.' Que faites-vous ?",opts:["Demandez les détails pour qualifier la douleur liée au support","Notez un critère implicite probable : qualité et réactivité du support. À adresser dans la proposition.","Rien — c'est anecdotique","Promettez immédiatement un support premium"],c:1,e:"Une mauvaise expérience passée est presque toujours un critère implicite actif. Ce DG évaluera votre support avec une attention particulière. En l'intégrant dans votre proposition, vous adressez une priorité qu'il n'a pas eu à expliquer."},
      {q:"Vous recevez un RFP avec 40 critères. Quelle est votre première action ?",opts:["Répondre uniquement aux critères sur lesquels vous avez un avantage","Identifier les 3-5 critères vraiment non-négociables et demander une réunion pour comprendre leur poids","Envoyer une proposition standard sans tenir compte du RFP","Répondre point par point à tous les critères"],c:1,e:"Un RFP de 40 critères cache souvent 5-8 critères décisifs. La réunion de qualification avant réponse vous permet de comprendre ce qui compte vraiment — et d'orienter votre réponse stratégiquement."}
    ],
    caseStudy:{
      label:"📋 Étude de cas — Le RFP surprise",
      doc:`<p><strong>Source :</strong> Email — Sandra Morel, Responsable IT — Prolux (retail, 220 personnes)</p><hr style="border:none;border-top:1px solid var(--border);margin:10px 0"><p><em>"Suite à nos échanges, notre direction a formalisé le processus de sélection. Grille d'évaluation :</em></p><p><em>1. Prix total sur 3 ans — pondération : <strong>40%</strong><br>2. Fonctionnalités techniques — pondération : <strong>30%</strong><br>3. Références clients retail — pondération : <strong>15%</strong><br>4. Support et SLA — pondération : <strong>15%</strong>"</em></p><p><em>Note interne du commercial : "Pas de références retail dans notre portfolio. On est forts sur le prix et la technique. Répondons au RFP."</em></p>`,
      questions:[
        {q:"Avec cette grille, quelle est votre position compétitive réaliste ?",opts:["Fragilisée sur un critère clé — références retail absentes et le prix seul ne gagne pas","Forte — prix et technique = 70% de la note","Forte si vous baissez votre prix au maximum","Neutre — toutes les solutions seront évaluées pareil"],c:0,e:"L'absence de références retail est un vrai handicap. Les références sectorielles sont souvent un critère de confiance encore plus important que les 15% affichés — un client retail se méfie d'un fournisseur qui n'a jamais géré leur type de problématique."},
        {q:"Quelle action pour influencer les critères AVANT de répondre au RFP ?",opts:["Contester la pondération formellement","Répondre avec le maximum de détails techniques","Demander une réunion pour comprendre les priorités réelles et proposer une référence distribution comme alternative proche","Rien — le RFP est envoyé, les critères sont fixés"],c:2,e:"Un RFP reçu n'est pas un point de non-retour. Une réunion de clarification permet de découvrir que les 40% sur le prix ne signifient pas 'moins cher = gagnant' et qu'une référence distribution peut partiellement compenser."},
        {q:"Le commercial note 'répondons au RFP' sans qualifier davantage. Quelle dimension MEDDPICC manque ?",opts:["Competition — il n'a pas identifié les autres fournisseurs","Metrics — il n'a pas chiffré la valeur","Decision Criteria approfondis — il accepte les critères tels quels sans chercher à les influencer","Champion — il ne sait pas si Sandra est un champion"],c:2,e:"Marc traite les critères comme fixes alors qu'ils peuvent être influencés. Il ne demande pas ce qui se cache derrière la pondération, ne vérifie pas si le prix est vraiment le facteur décisif, et n'explore pas comment compenser l'absence de références."}
      ]
    }
  },

  // 5 — DECISION PROCESS
  {
    id:'dp', nav:'Decision Process', sub:'D — Module 5',
    badge:'D — Decision Process', title:'D — Decision Process',
    subtitle:"Comprendre comment la décision va se prendre — et construire un reverse timeline réaliste.",
    blocks:[
      {t:'prose',h:'Définition',p:`<p>Le <strong>Decision Process</strong> décrit les étapes, les acteurs et le calendrier par lesquels une organisation prend sa décision d'achat. Ce n'est pas seulement "qui signe" — c'est le chemin complet de "besoin identifié" à "décision prise".</p><p>Il y a souvent un processus formel (étapes officielles) et un processus informel (comment les vraies décisions se prennent). MEDDPICC demande de comprendre les deux.</p>`},
      {t:'hl',v:'blue',lbl:'Technique clé : le Reverse Timeline',body:`Au lieu de demander "quand voulez-vous décider ?", construis le chemin <strong>à l'envers</strong> depuis la date de démarrage souhaitée.<br><br><em>"Vous voulez démarrer le 1er juin → contrat signé le 15 mai → validation DG : 2 sem. avant = 1er mai → validation juridique : 3 sem. avant = 10 avril → proposition remise : 20 mars."</em><br><br>Ce reverse timeline révèle souvent que la close date est irréaliste — et permet de l'anticiper.`},
      {t:'prose',h:'Le multi-threading : ne jamais dépendre d\'un seul fil',p:`<p>Le multi-threading consiste à avoir des contacts actifs <strong>à plusieurs niveaux</strong> de l'organisation. Un deal mono-thread est fragile :</p><p>— Ton interlocuteur principal quitte → deal mort.<br>— Il change de priorités → deal en pause.<br>— Il est enthousiaste mais sans pouvoir → deal fantôme.</p><p>En vente IT : DSI (technique), DAF (budget), DG (stratégie), responsable IT opérationnel (adoption).</p>`},
      {t:'hl',v:'amber',lbl:'⚠️ Effort ≠ Avancement',body:`Beaucoup de commerciaux confondent <strong>l'activité</strong> (emails, réunions, démos) avec <strong>l'avancement</strong>. La question clé : <em>"Quelle est la prochaine étape formelle du process de décision ?"</em> Si personne ne peut répondre précisément, le deal est bloqué.`},
      {t:'questions',h:'Questions pour cartographier le Decision Process',qs:["Comment avez-vous pris votre dernière décision d'achat IT similaire ?","Quelles sont les étapes formelles avant de pouvoir signer un contrat ?","Qui doit valider quoi, dans quel ordre ?","Y a-t-il un comité technique ou un comité d'approbation budgétaire ?","Quel est votre objectif de démarrage ? En partant de là, quelle est votre date de signature cible ?","Qu'est-ce qui pourrait faire glisser la décision de 1 à 2 mois ?"]},
      {t:'scenario',lbl:'🏭 NovaCorp — Reverse Timeline',p:`<p>Julien explique : <em>"Moi je valide techniquement, je présente à Sophie qui valide le budget. Ça devrait aller vite."</em></p><p>Reverse timeline depuis la date souhaitée (démarrage 1er juillet) :<br>🗓️ 1er juillet : démarrage projet<br>→ 15 juin : signature contrat<br>→ 1er juin : validation DG Sophie<br>→ <strong>⚠️ Sophie est en vacances 2 semaines en mai !</strong><br>→ Présentation à Sophie : 25 avril au plus tard<br>→ Proposition commerciale : 11 avril maximum</p><p><strong>Sans ce reverse timeline, tu aurais remis la proposition en mai — et raté la fenêtre de décision.</strong></p>`}
    ],
    quiz:[
      {q:"Tu as eu 8 réunions avec NovaCorp en 6 semaines. Le deal avance-t-il ?",opts:["Oui, la fréquence confirme que le budget est alloué","Non, 8 réunions c'est trop — tu sur-investis","Oui, 8 réunions montrent un fort engagement","Pas nécessairement — l'activité n'est pas un indicateur d'avancement. La clé : quelle est la prochaine étape formelle ?"],c:3,e:"L'activité n'est pas synonyme d'avancement. Un deal peut générer beaucoup d'activité sans franchir aucune étape formelle. La vraie question : 'Quelle est la prochaine étape dans leur processus de décision ?'"},
      {q:"À quoi sert la technique du Reverse Timeline ?",opts:["À remonter depuis la date souhaitée pour identifier toutes les étapes et les vraies dates critiques","À prévoir la durée d'implémentation","À calculer le temps passé sur une opportunité","À suivre l'historique des échanges"],c:0,e:"Le reverse timeline part de la date de démarrage souhaitée et remonte en arrière. Il révèle souvent que la close date annoncée est irréaliste, et permet d'anticiper les actions nécessaires."},
      {q:"Pourquoi le multi-threading est-il crucial ?",opts:["Pour réduire la dépendance à un seul interlocuteur et s'assurer que le deal avance même si l'un change de priorités","Pour court-circuiter le champion","Pour mieux comprendre les aspects techniques","Pour avoir plus de contacts à inviter aux événements"],c:0,e:"Un deal mono-thread est fragile : si ton seul interlocuteur part ou change de priorités, le deal s'effondre. Le multi-threading construit plusieurs points de contact à différents niveaux."},
      {q:"Un prospect dit 'on prendra la décision en octobre'. Quelle question posez-vous ?",opts:["Pouvez-vous vous engager formellement sur cette date ?","D'accord, je reviens début octobre","Quelle solution allez-vous choisir ?","Pour démarrer en octobre, quelles étapes faut-il franchir avant ? Qui doit valider quoi ?"],c:3,e:"Octobre est une intention, pas un processus. Le reverse timeline part de là : quelles validations avant ? La réunion EB ? La validation juridique ? En remontant, on découvre souvent que les actions doivent commencer en juillet."},
      {q:"Votre contact principal part en congé maternité dans 3 semaines. Quelle est la priorité immédiate ?",opts:["Attendre son retour","Activer le multi-threading : identifier d'autres contacts qui peuvent continuer à porter le projet","Accélérer pour closer avant son départ","Lui demander de signer avant de partir"],c:1,e:"Un contact unique qui disparaît peut geler un deal pendant des mois. Le multi-threading d'urgence s'impose : identifier son remplaçant, rencontrer l'EB directement, créer des liens avec d'autres parties prenantes."},
      {q:"Lors d'un appel, votre contact dit 'la prochaine étape c'est qu'on voit ça en interne et on vous revient'. Est-ce une étape formelle ?",opts:["Non — mais c'est suffisant pour attendre","Oui si c'est un comité de direction","Non — il faut demander : qui voit ça, avec qui, pour décider quoi, avant quelle date ?","Oui — c'est clair et précis"],c:2,e:"'On voit ça en interne' ne définit ni les acteurs, ni les critères, ni le délai. Sans ces précisions, vous ne savez pas si le deal avance ou s'il vient d'entrer dans une zone d'ombre où il peut rester indéfiniment."}
    ],
    caseStudy:{
      label:"📋 Étude de cas — Le pipeline qui tourne en rond",
      doc:`<p><strong>Source :</strong> Extrait CRM — Deal Optima Services — Commercial : Julie R.</p><hr style="border:none;border-top:1px solid var(--border);margin:10px 0"><p><em>Sem. 1 : Démo technique — très bien reçue<br>Sem. 2 : Call questions-réponses techniques<br>Sem. 3 : Relance email — pas de réponse<br>Sem. 4 : Réunion de présentation de l'offre<br>Sem. 5 : Call de suivi — "on regarde encore"<br>Sem. 6 : Relance — réponse positive, enthousiaste<br>Sem. 7 : Réunion pour rediscuter des options<br>Sem. 8 : En attente. Probabilité : 70%.</em></p><p><em>Note de Julie : "Contact très réactif et enthousiaste. Deal bien engagé."</em></p>`,
      questions:[
        {q:"En regardant le CRM, quelle est la vraie situation de ce deal ?",opts:["Il est en phase finale","Il est solide — le contact est enthousiaste","Il tourne en rond — beaucoup d'activité mais aucune étape formelle du Decision Process franchie","Il avance bien — 8 semaines d'engagement actif"],c:2,e:"8 semaines, 6 interactions, et le deal est toujours au même stade. Pas de validation EB, pas de critères formalisés, pas de processus cartographié. L'enthousiasme cache une stagnation réelle."},
        {q:"Quelle question Julie aurait dû poser dès la semaine 3 ?",opts:["Quelle est la prochaine étape formelle dans votre processus de décision — qui doit valider quoi, et avant quelle date ?","Avez-vous des questions supplémentaires ?","Êtes-vous satisfait de notre offre ?","Quand pouvez-vous vous engager ?"],c:0,e:"La question sur la prochaine étape formelle est la plus puissante pour diagnostiquer si un deal avance ou stagne. En semaine 3, la réponse aurait révélé soit un vrai processus en cours, soit son absence."},
        {q:"La probabilité est estimée à 70%. Est-ce justifié ?",opts:["Peut-être — 70% est raisonnable pour un deal en cours","Oui — l'enthousiasme et 8 semaines d'engagement le justifient","Oui si le DSI a confirmé verbalement","Non — sans Decision Process cartographié, sans EB rencontré, cette estimation n'est pas fondée"],c:3,e:"70% basé sur l'enthousiasme est un biais. Une estimation MEDDPICC se construit sur : EB rencontré, Decision Process clair, Metrics validées, Pain fort. Aucun de ces éléments n'apparaît. Ce deal devrait être à 30-40% maximum."}
      ]
    }
  },

  // 6 — PAPER PROCESS
  {
    id:'pp', nav:'Paper Process', sub:'P — Module 6',
    badge:'P — Paper Process', title:'P — Paper Process',
    subtitle:"Anticiper tout ce qui se passe entre le 'oui' de l'EB et le contrat signé — pour ne plus rater des close dates.",
    blocks:[
      {t:'prose',h:'Définition',p:`<p>Le <strong>Paper Process</strong> recouvre tous les processus d'approbation, de validation contractuelle, d'achats, de sécurité et de référencement fournisseur qui doivent être franchis pour qu'un contrat soit signé — même lorsque la décision d'achat est déjà prise.</p><p>C'est la lettre ajoutée à MEDDIC parce que des deals bien qualifiés sur toutes les autres dimensions échouaient quand même à cause de processus non anticipés.</p>`},
      {t:'hl',v:'red',lbl:'🔴 Distinction fondamentale',body:`<strong>Decision Process</strong> = comment la décision est <em>prise</em>.<br><strong>Paper Process</strong> = tout ce qui se passe <strong>après</strong> que la décision est prise, jusqu'à la signature.`},
      {t:'list',items:[{b:'Service achats',t:" — Procédure de mise en concurrence obligatoire au-delà d'un certain montant."},{b:'Validation juridique',t:" — Relecture des CGV, SLA, clauses de responsabilité. Peut prendre 3 à 6 semaines."},{b:'Validation sécurité / RSSI',t:" — Pour les solutions cloud, questionnaire, audit, certification obligatoire."},{b:'Référencement fournisseur',t:" — Onboarding (Kbis, assurances, RIB) avant de pouvoir signer."},{b:'Délégation de signature',t:" — Qui signe ? A-t-il délégation ? Où est-il le jour J ?"},{b:'DPA (Data Processing Agreement)',t:" — Obligatoire RGPD pour tout traitement de données personnelles."}]},
      {t:'hl',v:'green',lbl:'💡 Bonne pratique',body:`Demande le Paper Process <strong>tôt</strong> — dès que tu as confirmé l'intérêt du client. <em>"Pour bien calibrer notre planning, pouvez-vous me décrire le chemin entre la décision d'acheter et le contrat signé ?"</em> Cette question ne présume pas que la décision est prise, mais te donne toute l'info pour anticiper.`},
      {t:'questions',h:'Questions pour qualifier le Paper Process',qs:["Entre la décision d'acheter et la signature, que se passe-t-il de votre côté ?","Y a-t-il un service achats impliqué ? Procédure de mise en concurrence ?","Le service juridique doit-il valider le contrat ? Quel est leur délai habituel ?","Y a-t-il des exigences de sécurité pour référencer un fournisseur cloud ?","Qui a la délégation de signature pour 45 000€ ?","Avez-vous un modèle de DPA que vous utilisez habituellement ?"]},
      {t:'scenario',lbl:'🏭 NovaCorp — Paper Process',p:`<p>Tu demandes à Julien : <em>"Entre le moment où Sophie dit OK et la signature, il se passe quoi ?"</em></p><p>Réponse : <em>"Au-delà de 30 000€, notre expert-comptable doit valider. Et le contrat cloud, notre avocat voudra le relire."</em></p><p>⏱️ Expert-comptable : ~2 semaines<br>⏱️ Avocat (CGV + SLA + DPA) : ~3 semaines<br>📋 DPA obligatoire : as-tu un template prêt ?<br>✍️ Sophie signe électroniquement ou papier ?</p><p><strong>Sans cette information, tu aurais envoyé le contrat après le "OK" de Sophie — et attendu 5 semaines supplémentaires en croyant le deal quasiment signé.</strong></p>`}
    ],
    quiz:[
      {q:"La DG de NovaCorp te dit 'oui, on y va'. Le deal est-il signé ?",opts:["Ça dépend du montant","Oui, mais seulement si tu enregistres la conversation","Non — le 'oui' de l'EB est le début du Paper Process, pas la fin du deal","Oui — un 'oui' verbal de l'EB équivaut à une décision prise"],c:2,e:"Un 'oui' verbal de l'EB est une victoire de Decision Process — pas une victoire commerciale. Le Paper Process commence là. Expert-comptable, avocat, DPA, signature : tout reste à franchir."},
      {q:"Quel est le bon moment pour explorer le Paper Process ?",opts:["Uniquement pour les deals supérieurs à 100 000€","Uniquement après que l'EB a dit oui","Dès que tu as confirmé l'intérêt du client — bien avant la décision finale","Au moment d'envoyer la proposition"],c:2,e:"Plus tôt tu explores le Paper Process, mieux tu peux anticiper dans ton planning. Attendre le 'oui' de l'EB pour découvrir que le service achats impose 4 semaines de procédure, c'est systématiquement rater ses close dates."},
      {q:"Quelle est la différence principale entre Decision Process et Paper Process ?",opts:["Le Decision Process = comment la décision est prise ; le Paper Process = tout ce qui se passe après jusqu'à la signature","Ce sont deux façons de décrire la même chose","Le Decision Process est technique, le Paper Process commercial","Le Paper Process concerne uniquement les contrats physiques"],c:0,e:"Decision Process = comment le client décide d'acheter. Paper Process = le chemin entre 'la décision est prise' et 'le contrat est signé'. Deux processus distincts à cartographier séparément."},
      {q:"Un client annonce un seuil achats à 30 000€ et votre deal est à 35 000€ avec une close date dans 2 semaines. Que faites-vous ?",opts:["Attendre sans rien faire","Discuter avec votre contact pour comprendre si une exception est possible, sinon décaler la close date","Baisser à 29 900€ pour contourner la procédure","Envoyer le contrat maintenant et espérer que la procédure soit rapide"],c:1,e:"La première action est de comprendre si une exception ou un chemin alternatif existe. Si non, décaler la close date — une close date irréaliste crée des frustrations. Baisser le prix sous le seuil est une tactique risquée."},
      {q:"Pourquoi le DPA (Data Processing Agreement) est-il important dans une vente cloud ?",opts:["C'est uniquement nécessaire pour les données médicales","C'est optionnel — seules les grandes entreprises en ont besoin","C'est obligatoire dès que la solution traite des données personnelles — son absence peut bloquer la signature","C'est une formalité qui ne bloque jamais"],c:2,e:"Le RGPD impose un DPA pour tout traitement de données personnelles. En cloud IT, c'est quasi systématique. Un service juridique qui découvre l'absence de DPA au moment de la signature peut bloquer le deal pendant des semaines."},
      {q:"Votre Champion ne connaît pas leur Paper Process car 'on n'a jamais acheté de solution cloud'. Comment gérez-vous ça ?",opts:["Concluez que le Paper Process sera simple car inexistant","Envoyez le contrat et attendez","Proposez un template de processus simple et demandez-lui de le valider avec le DG et le service juridique","Demandez directement au DG de court-circuiter"],c:2,e:"Un Paper Process inexistant se crée — et peut prendre plus de temps qu'un processus établi. Proposer un template et le valider avec toutes les parties évite les surprises quand le contrat arrive entre les mains de personnes qui ne l'ont pas anticipé."}
    ],
    caseStudy:{
      label:"📋 Étude de cas — Le 'oui' qui ne se transforme pas en contrat",
      doc:`<p><strong>Source :</strong> Échange Slack interne — Commercial : Paul T.</p><hr style="border:none;border-top:1px solid var(--border);margin:10px 0"><p><em>Paul à son manager — Vendredi 14h :</em><br><em>"Super nouvelle ! Nathalie (DG de Kermex) m'a dit oui ce matin. J'envoie le contrat cet aprèm, on devrait signer début de semaine prochaine. Je mets le deal en Won ?"</em></p><p><em>Manager : "Attends. T'as qualifié le Paper Process ?"</em></p><p><em>Paul : "Bah... elle a dit oui ?"</em></p><p><em>[3 semaines plus tard :] "Toujours en attente. Leur avocat relit le contrat. Et le service achats demande 2 devis supplémentaires pour 42 000€..."</em></p>`,
      questions:[
        {q:"Quel était le vrai état du deal quand Paul a dit 'on devrait signer début de semaine' ?",opts:["Deal à risque à cause d'un concurrent","Deal en Won","Decision Process validé, Paper Process inconnu — le plus dur restait à faire","Deal signé — le oui verbal d'un DG suffit"],c:2,e:"Le 'oui' de la DG clôt le Decision Process mais ouvre le Paper Process. Sans avoir qualifié les étapes contractuelles, Paul n'avait aucune idée de ce qui l'attendait."},
        {q:"À quel moment Paul aurait dû poser la question du Paper Process ?",opts:["Dès qu'il avait confirmé l'intérêt sérieux de Kermex, bien avant la décision finale","Ce n'est pas à lui de demander","Lors de la remise de la proposition","Après le 'oui' de la DG"],c:0,e:"La question du Paper Process se pose quand le client est engagé mais avant que la décision soit prise. 'Pour préparer notre planning, pouvez-vous me décrire ce qui se passe entre la décision et la signature ?' — ne présume pas de la décision."},
        {q:"Le service achats demande 2 devis supplémentaires. Que révèle cette surprise ?",opts:["Kermex n'est pas sérieux","Paul n'a pas bien vendu","Le Paper Process n'était pas qualifié : une procédure de mise en concurrence à 42 000€ aurait dû être anticipée","Rien — c'est une procédure normale"],c:2,e:"Une procédure achats de ce type est prévisible si on pose la bonne question. 'Au-delà de quel montant votre service achats intervient-il ?' — une question simple qui évite 3 semaines de surprise."}
      ]
    }
  },

  // 7 — IDENTIFY PAIN
  {
    id:'pain', nav:'Identify Pain', sub:'I — Module 7',
    badge:'I — Identify Pain', title:'I — Identify / Implicate Pain',
    subtitle:"Identifier la douleur réelle — et en faire ressentir les implications — pour créer l'urgence de changer.",
    blocks:[
      {t:'prose',h:'Définition',p:`<p>Le <strong>Pain</strong> est le problème actuel ou anticipé suffisamment douloureux pour justifier un changement. Mais MEDDPICC ne s'arrête pas à l'identification — il demande d'<strong>impliquer</strong> la douleur : faire comprendre au client les conséquences réelles de ne pas agir.</p><p>La différence entre une "douleur" et un "problème" : la douleur a un coût, un risque, une urgence. Le problème peut vivre sans action.</p>`},
      {t:'hl',v:'red',lbl:'Distinction critique',body:`<strong>Douleur légère</strong> : "Notre infra est un peu vieille." → Le client peut vivre avec.<br><strong>Douleur forte</strong> : "Notre infra vieillissante risque de faire tomber le SLA d'un client qui représente 30% de notre CA et des pénalités contractuelles de 5 000€/incident." → Le client doit agir.`},
      {t:'prose',h:'La structure de découverte de la douleur',p:`<p>La meilleure approche pour découvrir et impliquer la douleur suit cette logique :</p>`},
      {t:'cards',n:3,cards:[{ico:'🔍',name:'1. Situation',p:"Comprendre le contexte actuel sans jugement. 'Décrivez-moi votre infrastructure actuelle.' 'Comment fonctionnez-vous aujourd'hui ?'"},{ico:'⚠️',name:"2. Problème",p:"Explorer les difficultés. 'Qu'est-ce qui ne fonctionne pas comme vous le voudriez ?' 'Où perdez-vous du temps / de l'argent ?'"},{ico:'💥',name:'3. Implication',p:"Creuser les conséquences. 'Que se passe-t-il si rien ne change dans 12 mois ?' 'Quel impact a ce problème sur vos objectifs business ?'"}]},
      {t:'prose',h:'Le Compelling Event : l\'urgence externe',p:`<p>Un <strong>Compelling Event</strong> est un événement externe qui crée une deadline naturelle et renforce l'urgence. C'est l'élément le plus puissant pour éviter le "on verra ça plus tard".</p><p>Exemples : fin de support Windows (date fixe), renouvellement contrat client (deadline), audit de conformité (date imposée), levée de fonds (croissance à soutenir).</p><p>Dans NovaCorp : la fin de support Windows + le SLA contractuel du grand compte sont deux compelling events puissants.</p>`},
      {t:'hl',v:'amber',lbl:'⚠️ Erreurs courantes',body:`<strong>1. Rester au niveau symptôme</strong> — "Vos serveurs sont vieux" est un symptôme. "Vous perdez 36 000€/an en risque de pénalité" est une douleur.<br><br><strong>2. Découvrir la douleur trop tard</strong> — Si tu découvres la vraie douleur après avoir envoyé la proposition, tu ne peux plus t'en servir pour qualifier.<br><br><strong>3. Imposer la douleur</strong> — La douleur doit être <em>découverte et partagée</em> par le client, pas affirmée par le commercial.`},
      {t:'questions',h:'Questions pour découvrir et impliquer la douleur',qs:["Quels sont vos plus grands défis opérationnels en ce moment ?","Qu'est-ce qui vous a poussé à chercher une solution maintenant plutôt que dans 6 mois ?","Que se passe-t-il si ce problème n'est pas résolu d'ici la fin de l'année ?","Qui d'autre est impacté par ce problème dans votre organisation ?","Avez-vous déjà essayé de résoudre ce problème par le passé ? Qu'est-ce qui a bloqué ?","Si vous deviez mettre un chiffre sur ce problème, ça représenterait quoi ?"]},
      {t:'scenario',lbl:'🏭 NovaCorp — Cartographie de la douleur',p:`<p><strong>Douleur de surface (Julien)</strong> : "Notre infra est vieille, on a des pannes."<br><strong>Douleur réelle (découverte en creusant)</strong> : Risque de perdre un contrat grand compte (120 000€/an) + pénalités 5 000€/incident + fin de support Windows à venir.</p><p><strong>Compelling Events</strong> :<br>📅 Fin de support Windows 10 : date fixe et imminente<br>📋 Renouvellement contrat grand compte : audit SLA prévu dans 4 mois</p><p>✅ <strong>La douleur est forte, chiffrée et urgente.</strong> C'est le socle de tout le deal. Chaque fois que la décision pourrait glisser, tu reviens sur ces chiffres.</p>`}
    ],
    quiz:[
      {q:"Julien te dit : 'Notre infra est un peu vieillissante, ça crée parfois des petits soucis.' C'est une douleur qualifiée ?",opts:["Non — c'est un symptôme. Il faut creuser les implications concrètes et les chiffrer","Oui, si le DSI est préoccupé, c'est une douleur valide","Oui, c'est suffisant pour avancer","Non, mais uniquement parce qu'il n'a pas mentionné de montant"],c:0,e:"'Petits soucis' est un symptôme, pas une douleur. Une douleur a un coût, un risque, une urgence. Il faut creuser : 'Que se passe-t-il concrètement lors d'une panne ? Qui est impacté ? Quel est le coût ?'"},
