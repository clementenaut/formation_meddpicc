      {t:'hl',v:'green',lbl:'✅ Points forts du deal',body:`Les <strong>Metrics</strong> sont solides et chiffrées. La <strong>douleur</strong> est forte et urgente (deux compelling events). Le <strong>champion</strong> Julien est aligné techniquement. Les <strong>Decision Criteria</strong> sont clairs et t'avantagent face au concurrent A.`}
    ],
    quiz:[
      {q:"Le Paper Process de NovaCorp est 'inconnu'. Quelle est la bonne décision avant de remettre la proposition ?",opts:["Retarder la proposition jusqu'à avoir qualifié le Paper Process complet","Envoyer la proposition et inclure une note sur le Paper Process","Supposer qu'il n'y a pas de processus complexe car c'est une PME","Remettre la proposition maintenant et qualifier ensuite"],c:0,e:"Remettre une proposition sans connaître le Paper Process c'est naviguer à l'aveugle sur la dernière ligne droite. 5 minutes d'appel avec Julien peuvent révéler 4 semaines de délai supplémentaire à anticiper."},
      {q:"Sophie (EB) dit qu'elle 'doit réfléchir encore'. Que fais-tu ?",opts:["Baisser le prix pour faciliter la décision","Attendre — l'EB a besoin de temps","Demander à Julien ce qui bloque et attendre sa réponse","Revenir sur le coût d'inaction et le Compelling Event — rendre le statu quo douloureux"],c:3,e:"'Je dois réfléchir' signifie souvent que la douleur n'est pas assez forte ou l'urgence pas assez claire. Revenir sur le coût d'inaction et les compelling events (renouvellement grand compte dans 4 mois) est l'action prioritaire."},
      {q:"Quelle est la fragilité principale du deal NovaCorp en l'état ?",opts:["Le prix est trop élevé","Les métriques ne sont pas suffisantes","Julien est le seul champion et le Paper Process est inconnu","Le concurrent A est mieux positionné"],c:2,e:"Un seul champion + Paper Process inconnu = double risque. Si Julien change de poste ou si le Paper Process révèle 6 semaines de délais, le deal peut s'effondrer. Ces deux dimensions sont les priorités d'action immédiates."},
      {q:"Vous avez rencontré Sophie une seule fois (20 min). Est-ce suffisant pour qualifier l'EB ?",opts:["Non — il faut une réunion de validation pour confirmer ses priorités et son angle de décision","Oui — vous connaissez son nom et son rôle","Oui si Julien a confirmé qu'elle est favorable","Oui pour une PME — les DG décident rapidement"],c:0,e:"Un call de 20 min donne un premier contact mais pas une qualification EB solide. Il faut une réunion dédiée pour valider : est-ce que Sophie partage la lecture des risques de Julien ? Quelles sont ses priorités personnelles ?"},
      {q:"Le concurrent A ne répond pas au critère hébergement France. Le deal est-il gagné pour autant ?",opts:["Oui si Julien confirme que le concurrent A est disqualifié","Oui — les autres critères vous avantagent aussi","Oui — si le concurrent principal est éliminé, vous avez l'avantage","Non — le statu quo reste une option réelle et Sophie peut décider de repousser le projet"],c:3,e:"Éliminer un concurrent ne gagne pas le deal. Le statu quo reste la vraie alternative. Sophie peut toujours décider que moderniser l'infra n'est pas la priorité de l'année, peu importe que le concurrent soit disqualifié."},
      {q:"Pour améliorer le score de NovaCorp sur les deux dimensions les plus faibles, quelles sont les deux actions prioritaires ?",opts:["Qualifier la compétition et baisser le prix","Trouver un 2e champion et envoyer la proposition","Baisser le prix et ajouter des fonctionnalités","Qualifier le Paper Process complet et organiser une vraie réunion de validation avec Sophie (EB)"],c:3,e:"Paper Process inconnu = risque de close date. EB insuffisamment qualifiée = risque de décision non informée. Ces deux dimensions couvrent les risques les plus immédiats. Les autres dimensions sont importantes mais moins urgentes."}
    ],
    caseStudy:{
      label:"📋 Étude de cas — Pipeline review : trois deals à évaluer",
      doc:`<p><strong>Source :</strong> Extraits CRM — Réunion Pipeline Review mensuelle</p><hr style="border:none;border-top:1px solid var(--border);margin:10px 0"><p><strong>Deal A — Proximed :</strong> EB rencontrée 2 fois, Metrics validées (35k€ coût d'inaction/an), Champion actif, Decision Criteria clairs, Reverse Timeline construit, Paper Process qualifié (avocat + 3 sem). Compelling Event : audit RGPD dans 6 semaines. <em>Probabilité affichée : 60%.</em></p><p><strong>Deal B — Granit SAS :</strong> Contact enthousiaste (DSI), 5 réunions en 8 semaines, démo très bien reçue. EB jamais rencontrée. Pain : "on veut moderniser". <em>Probabilité affichée : 80%.</em></p><p><strong>Deal C — Sofitel Logistics :</strong> EB rencontrée, Pain fort et chiffré, Decision Criteria inconnus, pas de Champion identifié, Paper Process non qualifié. <em>Probabilité affichée : 45%.</em></p>`,
      questions:[
        {q:"Quel deal a la probabilité de closing la plus réaliste selon MEDDPICC ?",opts:["Deal C — l'EB est rencontrée et la douleur est forte","Deal A — la plupart des dimensions sont qualifiées avec des preuves concrètes","Deal B — 80% et 5 réunions","Impossible à dire"],c:1,e:"Deal A est le mieux qualifié : EB rencontrée, Metrics validées, Champion actif, Paper Process connu, Compelling Event fort. 60% sous-estime probablement ce deal. Deal B à 80% repose sur l'enthousiasme sans EB qualifiée."},
        {q:"Deal B est estimé à 80% mais l'EB n'a jamais été rencontrée. Comment recalibrez-vous ?",opts:["80% est correct si le DSI confirme que le DG est favorable","70% — l'enthousiasme compense","30-40% maximum — sans EB qualifiée, le deal peut s'effondrer à tout moment","80% reste correct car c'est une PME"],c:2,e:"80% sans EB est un chiffre dangereux qui fausse le forecast. Il reflète l'enthousiasme du commercial, pas la qualification. Sans EB, le deal peut être tué par quelqu'un qu'on n'a jamais rencontré."},
        {q:"Deal C a un point fort (EB rencontrée, pain chiffré) mais plusieurs dimensions inconnues. Quelle est la priorité ?",opts:["Qualifier le Paper Process en priorité","Travailler sur la compétition","Qualifier les Decision Criteria et identifier un Champion avant d'aller plus loin","Envoyer la proposition pendant que la relation EB est chaude"],c:2,e:"Sans Decision Criteria, vous ne savez pas sur quels critères vous serez évalué. Sans Champion, vous n'avez pas de relais interne. Envoyer une proposition dans ce contexte, c'est envoyer un message bien écrit à quelqu'un qui n'a pas les outils pour décider."}
      ]
    }
  },

  // 11 — DEAL REVIEW
  {
    id:'dealreview', nav:'Deal Review & CRM', sub:'Opérationnel — Module 11',
    badge:'Module 11 — Opérationnel', title:'Deal Review & CRM — Rendre MEDDPICC visible',
    subtitle:"MEDDPICC ne crée de la valeur que s'il est intégré dans les routines quotidiennes et dans le CRM.",
    blocks:[
      {t:'prose',h:"De la méthode à l'habitude",p:`<p>MEDDPICC sans discipline d'exécution reste un cadre théorique. Les organisations qui en tirent le plus de valeur sont celles qui l'ont transformé en <strong>langage commun</strong> — visible dans le CRM, au cœur des deal reviews, dans les cadences managériales.</p><p>En tant que commercial en ESN, voici comment l'intégrer dans ton quotidien sans que ce soit une charge administrative supplémentaire.</p>`},
      {t:'prose',h:'Les champs CRM minimum viables',p:`<p>L'objectif : transformer chaque lettre de MEDDPICC en données structurées dans HubSpot, pas en notes dispersées. Les champs minimum à créer :</p>`},
      {t:'list',items:[{b:'Metrics',t:" — Baseline / Cible / Valeur estimée (€) / Horizon / Validé par EB ? (O/N)"},{b:'Economic Buyer',t:" — Nom + Rôle + Date dernier échange + Accès obtenu ? (O/N)"},{b:'Decision Criteria',t:" — Critères listés + Critères non-négociables identifiés (O/N)"},{b:'Decision Process',t:" — Étapes + Jalons datés + Multi-thread (O/N)"},{b:'Paper Process',t:" — Approbateurs identifiés + Délais estimés + DPA requis ? (O/N)"},{b:'Pain',t:" — Pain statement + Compelling event + Chiffré (O/N)"},{b:'Champion',t:" — Nom + Influence testée (O/N) + 2e champion identifié ? (O/N)"},{b:'Competition',t:" — Concurrents en lice + Statu quo adressé ? (O/N)"}]},
      {t:'hl',v:'blue',lbl:'La deal review MEDDPICC',body:`Une deal review efficace n'est pas un tour de table sur les valeurs et stages. C'est une <strong>inspection de la qualité des preuves</strong>.<br><br>Format recommandé (25–30 min par deal stratégique) :<br>1. Score RAG rapide (vert/orange/rouge/inconnu) pour chaque lettre<br>2. 2 questions "preuve" sur les dimensions faibles<br>3. 1 à 3 actions datées pour combler les gaps (owner + date)`},
      {t:'cards',n:2,cards:[{ico:'✅',name:'Bonne deal review',p:"'Le Paper Process est orange — on ne connaît pas le délai juridique. Action : Julien appelle l'avocat de Sophie avant vendredi pour estimer le délai. Owner : Julien. Date : vendredi.'"},{ico:'❌',name:'Mauvaise deal review',p:"'NovaCorp avance bien, Julien est chaud, la proposition part lundi.' → Pas de preuve, pas d'action précise, pas de risque identifié. C'est une update, pas une deal review."}]},
      {t:'prose',h:'La cadence hebdomadaire',p:`<p>Pour rendre MEDDPICC opérationnel au quotidien, adopte cette habitude simple :</p><p><strong>Chaque lundi matin (15 min)</strong> : pour chaque deal actif, passe mentalement en revue les 8 lettres. Quelle est la dimension la plus faible ? Quelle est l'action de la semaine pour la renforcer ?</p><p>Une seule action prioritaire par deal par semaine. Pas de liste de 12 tâches — une action, un owner, une date.</p>`},
      {t:'hl',v:'green',lbl:'💡 Le principe de "one unknown = one action"',body:`Pour chaque dimension MEDDPICC qui est <strong>inconnue ou rouge</strong>, il doit y avoir une action datée dans le pipeline. Pas de deal qualifié "vert" si une dimension reste inconnue depuis plus de 2 semaines. C'est la règle qui empêche les forecasts optimistes de masquer des deals fragiles.`}
    ],
    quiz:[
      {q:"Quelle est la principale valeur d'intégrer MEDDPICC dans le CRM ?",opts:["Générer des rapports pour les investisseurs","Transformer les preuves de qualification en données structurées visibles et coachables par le management","Réduire le nombre d'emails internes","Automatiser l'envoi des propositions"],c:1,e:"MEDDPICC dans le CRM crée un langage commun visible : le management peut coacher sur les gaps, les commerciaux peuvent se challenger mutuellement, et les forecasts reposent sur des preuves plutôt que sur des impressions."},
      {q:"En deal review, un commercial dit : 'NovaCorp avance bien, la proposition part lundi.' C'est :",opts:["Une update de statut, pas une deal review. Aucune dimension MEDDPICC n'a été qualifiée ou challengée","Une deal review suffisante pour les petits deals","Un bon résumé si le deal est en phase finale","Une bonne deal review — l'essentiel est dit"],c:0,e:"'Ça avance bien' n'est pas une qualification. Une deal review MEDDPICC interroge les preuves : quel est le score de chaque dimension ? Quelle est la dimension la plus faible ? Quelle action pour la semaine ?"},
      {q:"Qu'est-ce que le principe 'one unknown = one action' signifie concrètement ?",opts:["Pour chaque réunion, créer une tâche de suivi","Pour chaque dimension MEDDPICC inconnue, il doit y avoir une action datée pour la qualifier","Pour chaque client inconnu, créer une action de prospection","Pour chaque competitor inconnu, faire une recherche de marché"],c:1,e:"Si une dimension reste inconnue, c'est une bombe à retardement dans le pipeline. Le principe impose de transformer chaque inconnue en action concrete : qui pose la question ? quand ? Ce mécanisme est ce qui distingue un pipeline 'propre' d'un pipeline optimiste."},
      {q:"Lors d'une deal review, un commercial dit 'Paper Process orange — l'avocat prend 3 semaines, action : Julien confirme le délai avant vendredi'. C'est :",opts:["Une bonne deal review — dimension qualifiée, gap identifié, action datée avec owner","Correct seulement pour les deals complexes","Trop détaillé — une deal review doit rester de haut niveau","Insuffisant — il faudrait aussi qualifier toutes les autres dimensions"],c:0,e:"C'est exactement le format attendu : dimension scorée, gap précis, action avec owner et date. Une deal review MEDDPICC efficace produit ce type d'output pour chaque dimension faible."},
      {q:"Pourquoi les forecasts basés sur le 'gut feeling' du commercial sont-ils problématiques ?",opts:["Ils ne reposent pas sur des preuves qualifiées et créent des surprises de closing","Ils donnent des résultats trop optimistes","Ils prennent trop de temps à produire","Ils ne le sont pas — l'expérience du commercial est précieuse"],c:0,e:"Le gut feeling peut trahir : les commerciaux ont naturellement tendance à surestimer leurs chances. MEDDPICC force à s'appuyer sur des preuves concrètes pour chaque dimension — ce qui produit des forecasts plus fiables."},
      {q:"Quelle est la cadence recommandée pour appliquer MEDDPICC sur ses deals actifs ?",opts:["Une fois par trimestre","Uniquement lors des deal reviews mensuelles","Uniquement quand un deal semble bloqué","Chaque semaine : pour chaque deal actif, identifier la dimension la plus faible et définir une action"],c:3,e:"L'habitude hebdomadaire de 15 min — passer les 8 dimensions en revue, identifier la plus faible, définir une action — est ce qui transforme MEDDPICC d'une méthode théorique en réflexe opérationnel."}
    ],
    caseStudy:{
      label:"📋 Étude de cas — La deal review qui révèle tout",
      doc:`<p><strong>Source :</strong> Extrait deal review — Manager : Sophie V. — Commercial : Romain D. — Deal Axeltech</p><hr style="border:none;border-top:1px solid var(--border);margin:10px 0"><p><em>Sophie : "Axeltech, tu m'en dis quoi ?"</em></p><p><em>Romain : "Ça avance bien. Le DSI est très chaud, on a fait 3 démos, la proposition part lundi."</em></p><p><em>Sophie : "L'EB, c'est qui ?"</em></p><p><em>Romain : "Le DSI, je pense."</em></p><p><em>Sophie : "Tu penses ? Vous avez parlé budget ?"</em></p><p><em>Romain : "Pas encore, mais c'est dans les cordes."</em></p><p><em>Sophie : "Paper Process ?"</em></p><p><em>Romain : "Pas encore creusé..."</em></p><p><em>Sophie : "Compelling event ?"</em></p><p><em>Romain : "...ils ont envie d'avancer."</em></p>`,
      questions:[
        {q:"Combien de dimensions MEDDPICC sont réellement qualifiées dans ce deal ?",opts:["4 à 5 — le DSI est engagé et la démo bien reçue","3 — Metrics, Champion et Pain sont partiellement couverts","1 maximum — le contact est enthousiaste mais presque rien n'est qualifié","6 — il manque juste EB et Paper Process"],c:2,e:"En lisant attentivement : EB inconnue (Romain 'pense' que c'est le DSI), budget non discuté, Paper Process non exploré, Compelling Event absent. Ce deal repose entièrement sur l'enthousiasme d'un contact. Envoyer la proposition lundi serait prématuré."},
        {q:"La deal review de Sophie est-elle une bonne deal review ?",opts:["Non — elle aurait dû laisser Romain finir son update","Oui — elle challenge chaque dimension avec des questions de preuve, exactement ce qu'une deal review MEDDPICC doit faire","Non — elle est trop agressive avec Romain","Oui mais uniquement parce qu'elle est la manager"],c:1,e:"Sophie applique parfaitement la deal review MEDDPICC : elle ne se contente pas de l'update, elle challenge chaque dimension en demandant des preuves. C'est ce type d'inspection qui révèle les deals fragiles avant qu'ils échouent."},
        {q:"Quelle action immédiate Romain devrait-il prendre AVANT d'envoyer la proposition lundi ?",opts:["Envoyer la proposition comme prévu — le DSI validera","Qualifier l'EB (qui a vraiment l'autorité budgétaire ?), discuter budget, et explorer le Paper Process minimalement","Retravailler la proposition pour la rendre plus solide","Demander au DSI de confirmer par email son intention d'achat"],c:1,e:"Envoyer une proposition sans EB qualifiée et sans budget discuté, c'est envoyer une proposition dans le vide. 2 appels de 20 min cette semaine peuvent révéler que l'EB est le DG — et que le DSI n'a pas l'autorité pour valider 45 000€."}
      ]
    }
  },

  // 12 — SYNTHÈSE
  {
    id:'synthese', nav:'Synthèse & Checklist', sub:'Final — Module 12',
    badge:'Module final', title:'Synthèse — MEDDPICC en une page',
    subtitle:"La checklist complète, les questions clés, et les prochaines étapes pour appliquer dès demain.",
    blocks:[
      {t:'hl',v:'purple',lbl:'Récapitulatif des 8 dimensions',body:`<strong>M — Metrics</strong> : Chiffrer la valeur. Baseline → Cible → Coût d'inaction.<br><strong>E — Economic Buyer</strong> : Qui peut signer ou tuer le deal ? Accès obtenu ?<br><strong>D — Decision Criteria</strong> : Explicites et implicites. Les influencer tôt.<br><strong>D — Decision Process</strong> : Reverse timeline. Multi-threading.<br><strong>P — Paper Process</strong> : Achats, juridique, sécurité, DPA. Qualifier tôt.<br><strong>I — Identify Pain</strong> : Douleur forte, chiffrée, urgente. Compelling event.<br><strong>C — Champion</strong> : Enthousiasme + Influence + Accès. Tester par l'action.<br><strong>C — Competition</strong> : Concurrents + statu quo. Se différencier sur les critères du client.`},
      {t:'prose',h:'Les 5 principes non-négociables',p:`<p><strong>1. Zéro supposition</strong> — Ce qui n'est pas prouvé est "inconnu". Jamais "supposé vert".<br><strong>2. Preuves, pas impressions</strong> — Chaque dimension doit être justifiée par un fait, une date, un chiffre.<br><strong>3. Action sur chaque inconnu</strong> — Un inconnue = une action datée avec un owner.<br><strong>4. Discipline continue</strong> — MEDDPICC n'est pas une checklist de début de deal. C'est une inspection permanente.<br><strong>5. Champion testé</strong> — Un champion ne se déclare pas, il se prouve par ses actions.</p>`},
      {t:'prose',h:'Prochaines étapes — appliquer dès demain',p:`<p>Pour passer de la formation à la pratique :</p>`},
      {t:'list',items:[{b:'Cette semaine',t:" — Prends un deal actif dans ton pipeline. Passe les 8 dimensions en revue. Quels sont les inconnus ? Quelles sont les dimensions rouges ?"},{b:'Ce mois-ci',t:" — Crée les champs MEDDPICC dans HubSpot. Même basiques : un champ 'score RAG' par dimension suffit pour commencer."},{b:'Dans 3 mois',t:" — Identifie un deal gagné et un deal perdu. Analyse-les avec MEDDPICC : quelle dimension t'a sauvé ? laquelle t'a manqué ?"},{b:'Sur le long terme',t:" — Propose une cadence de deal review avec ton manager basée sur le scoring MEDDPICC. C'est le meilleur levier de progrès."}]},
      {t:'scenario',lbl:'📚 Ressources pour aller plus loin',p:`<p><strong>Livres :</strong><br>— "Always Be Qualifying" (Darius Lahoutifard) — la bible de MEDDIC par son co-créateur<br>— "The Challenger Sale" — complément sur le profil commercial qui crée de la valeur</p><p><strong>Outils :</strong><br>— Scorecard 1-5 par dimension (intégrable dans HubSpot)<br>— Template de deal review MEDDPICC (15 questions de coaching)<br>— Question bank de discovery (à adapter à votre contexte)</p><p><strong>À pratiquer :</strong><br>— Jeux de rôle discovery avec un collègue — 30 minutes/semaine<br>— Reverse timeline sur chaque nouveau deal dès la 2e réunion</p>`},
      {t:'hl',v:'green',lbl:'🎯 Objectif final',body:`MEDDPICC n'est pas une check-box à cocher avant de passer à autre chose. C'est un <strong>état d'esprit de qualification permanente</strong>.<br><br>Le commercial MEDDPICC ne se demande pas "comment je vends ?" — il se demande <em>"est-ce que ce deal est réellement qualifié ? Qu'est-ce qui pourrait me faire rater ce closing ?"</em><br><br>Cette façon de penser, une fois ancrée, change fondamentalement la qualité de ton pipeline — et tes résultats.`}
    ],
    quiz:[
      {q:"Un deal a des métriques solides, un champion enthousiaste, et un EB favorable. Mais le Paper Process est inconnu depuis 3 semaines. Ce deal est :",opts:["Vert — les dimensions principales sont qualifiées","Orange / à risque — un Paper Process inconnu peut retarder ou bloquer la signature","Rouge — il faut tout recommencer","Vert si la close date est dans 2 mois"],c:1,e:"Un Paper Process inconnu est un risque concret sur la close date — peu importe la qualité des autres dimensions. 'One unknown = one action' : qualifier le Paper Process cette semaine."},
      {q:"Quelle est la différence entre un pipeline 'actif' et un pipeline 'qualifié' selon MEDDPICC ?",opts:["Un pipeline qualifié repose sur des preuves pour chaque dimension, pas sur des impressions et des suppositions","Un pipeline actif génère plus de réunions","Un pipeline actif a plus d'opportunités","Il n'y a pas de différence — actif et qualifié sont synonymes"],c:0,e:"Un pipeline actif peut être plein de deals qui ne se closeront jamais, basés sur des suppositions optimistes. Un pipeline qualifié MEDDPICC repose sur des preuves pour chaque dimension. Moins de deals, mais plus fiables — et une capacité à prioriser les efforts là où ils ont le plus d'impact."},
      {q:"Quelle est la première chose à faire pour appliquer MEDDPICC sur un deal existant ?",opts:["Passer les 8 dimensions en revue sur ce deal : quels sont les inconnus ? les rouges ? les actions prioritaires ?","Refaire toute la discovery depuis le début","Envoyer un questionnaire MEDDPICC au prospect","Attendre le prochain deal pour appliquer la méthode proprement"],c:0,e:"MEDDPICC s'applique à n'importe quel stade du deal. La première action : faire le tour des 8 dimensions et identifier les gaps. Les inconnus deviennent des actions. Les rouges deviennent des priorités. C'est applicable dès aujourd'hui sur un deal existant."},
      {q:"Un commercial avec 3 ans d'expérience dit : 'Je connais mes clients, je n'ai pas besoin de MEDDPICC.' Que lui répondez-vous ?",opts:["L'expérience et la méthode sont complémentaires. MEDDPICC force à documenter ce que l'expérience rend intuitif — et à le rendre coachable, prévisionnel et transmissible.","Il a tort — l'expérience ne vaut rien sans méthode","Il devrait appliquer MEDDPICC uniquement sur ses gros deals","Il a raison — l'expérience remplace la méthode"],c:0,e:"L'expérience est précieuse mais invisible. MEDDPICC rend la qualification explicite, documentée et partageable. Un pipeline basé sur l'intuition de plusieurs commerciaux est imprévisible. MEDDPICC crée un langage commun qui améliore tout le monde."},
      {q:"Quel est l'indicateur le plus fiable qu'un deal est vraiment bien qualifié ?",opts:["Le client est enthousiaste et répond vite","La probabilité de closing affichée dans le CRM","Chaque dimension MEDDPICC est scorée avec une preuve concrète et chaque inconnue a une action datée","Le nombre de réunions effectuées"],c:2,e:"Un deal bien qualifié ne se mesure pas au nombre de réunions ni à l'enthousiasme — il se mesure à la qualité des preuves par dimension. Si chaque lettre de MEDDPICC est documentée avec un fait, une date ou un chiffre, le deal est qualifié."},
      {q:"MEDDPICC est-il applicable uniquement aux commerciaux, ou a-t-il d'autres usages ?",opts:["Uniquement en B2B SaaS","Uniquement aux deals supérieurs à 50 000€","Uniquement aux commerciaux terrain","À tous ceux qui touchent le cycle de vente : avant-vente (technique), management (coaching deals), customer success (renouvellements)"],c:3,e:"MEDDPICC structure la pensée de qualification pour tous ceux qui touchent un deal. L'avant-vente utilise Decision Criteria et Pain pour préparer les démos. Le management l'utilise pour coacher. Le CS l'utilise pour qualifier les renouvellements à risque."}
    ],
    caseStudy:{
      label:"📋 Étude de cas finale — Retour sur un deal perdu",
      doc:`<p><strong>Source :</strong> Analyse post-mortem — Commercial : Marc T. — Deal Zenova (SaaS BTP, 200 personnes) — Deal perdu après 3 mois</p><hr style="border:none;border-top:1px solid var(--border);margin:10px 0"><p><em>Timeline :</em></p><p><em>Mois 1 : 4 réunions avec le DSI Thomas, très enthousiaste. Démo validée, solution appréciée.</em></p><p><em>Mois 2 : Proposition envoyée (55 000€). Retour positif du DSI : "c'est exactement ce qu'on cherche".</em></p><p><em>Mois 3 : Deal perdu. Explication du DSI : "Le DG a décidé de repousser le projet à l'an prochain — d'autres priorités budget."</em></p><p><em>Score MEDDPICC reconstruit a posteriori : M=Orange, E=Rouge, D=Orange, D=Orange, P=Inconnu, I=Orange, C=Orange, C=Inconnu.</em></p>`,
      questions:[
        {q:"Quelle dimension MEDDPICC explique principalement la perte de ce deal ?",opts:["E — l'Economic Buyer (DG) n'a jamais été rencontré ni qualifié","M — les métriques n'étaient pas assez solides","C — le champion n'était pas assez fort","C — la compétition n'a pas été gérée"],c:0,e:"Le DG a décidé seul, sans que Marc ait jamais eu l'occasion de l'influencer. L'enthousiasme du DSI était réel mais insuffisant — il n'avait pas l'autorité pour protéger le deal contre une décision budgétaire de la direction."},
        {q:"Si Marc avait rencontré le DG au mois 1, qu'aurait-il pu éviter ?",opts:["Il aurait évité 3 mois de travail inutile","Il aurait pu qualifier les vraies priorités du DG et adresser le risque de compétition budgétaire dès le début — et peut-être positionner le projet différemment","Rien — si le DG avait d'autres priorités, rien ne pouvait changer","Il aurait pu envoyer la proposition plus tôt"],c:1,e:"Rencontrer l'EB tôt permet de qualifier ses priorités réelles — pas seulement celles du champion technique. Si le DG avait d'autres projets prioritaires, Marc aurait pu le savoir et adapter sa stratégie : créer un Compelling Event, phaser le projet, ou qualifier si le timing était bon."},
        {q:"Quel enseignement principal tirer de ce post-mortem ?",opts:["Toujours demander le budget dès la première réunion","Ne jamais travailler avec des DSI — ils ne sont jamais les vrais décisionnaires","L'enthousiasme d'un contact technique ne remplace pas la qualification de l'EB. Un deal bien engagé techniquement peut échouer si l'EB n'a pas été aligné sur les priorités et les contraintes budgétaires.","Ne pas envoyer de proposition avant 3 mois de qualification"],c:2,e:"Ce deal illustre parfaitement pourquoi l'EB est non-négociable. Thomas était convaincu, sincère, et enthousias — mais sans autorité. Le DG a pris une décision budgétaire que Marc n'a jamais eu la chance d'influencer. C'est la cause de perte la plus fréquente et la plus évitable."}
      ]
    }
  }
,

  // ═══════════════════ MODULE 13 — TECHSPRINT CAS COMPLET ═══════════════════
  {
    id:'techsprint', nav:'Cas complet — TechSprint', sub:'Cas avancé — Module 13',
    badge:'Module 13 — Cas avancé', title:'TechSprint — Qualifier un deal ambigu',
    subtitle:"Un deal qui semble bien engagé... mais l'est-il vraiment ? Appliquer MEDDPICC sur un cas complexe avec des signaux contradictoires.",
    blocks:[
      {t:'hl',v:'blue',lbl:'🎯 Objectif de ce module',body:`Dans les modules précédents, tu as appris chaque dimension de MEDDPICC séparément. Ce module teste ta capacité à <strong>tout combiner</strong> face à un deal réel avec des signaux mixtes.<br><br>Lis attentivement le dossier TechSprint. Certains éléments semblent positifs. D'autres cachent des risques. Ton rôle : identifier ce qui est réellement qualifié, ce qui ne l'est pas, et ce qu'il faut faire.`},
      {t:'prose',h:'Le dossier TechSprint',p:`<p>TechSprint est une ESN de 240 personnes spécialisée dans le développement logiciel, basée à Bordeaux. Ils cherchent à moderniser leur infrastructure cloud pour leurs équipes de développement réparties sur 4 sites en France.</p>`},
      {t:'hl',v:'blue',lbl:'📁 Contexte commercial — Semaine 1',body:`<strong>Origine :</strong> Appel entrant — Guillaume Ferrand, DSI de TechSprint, a trouvé votre ESN via LinkedIn.<br><br><strong>Échange initial :</strong> Guillaume explique qu'ils ont des problèmes de synchronisation de code entre les sites, des environnements de dev instables, et que les équipes perdent du temps. Il est enthousiaste, technique, et connaît bien le sujet. Il mentionne un "budget disponible" et dit vouloir "avancer rapidement".<br><br><strong>Première réunion :</strong> 2h de discussion technique avec Guillaume. Il présente l'environnement actuel, les pain points en détail. Il mentionne que "la direction est favorable" au projet.`},
      {t:'hl',v:'blue',lbl:'📁 Évolution du deal — Semaines 2 à 5',body:`<strong>Semaine 2 :</strong> Démo technique — très bien reçue. Guillaume invite deux de ses ingénieurs seniors. Ils posent des questions pointues et semblent convaincus.<br><br><strong>Semaine 3 :</strong> Guillaume demande une proposition détaillée. Il précise : "On a un budget de 80 000€ alloué." Il mentionne qu'une autre ESN propose quelque chose mais "votre approche est meilleure techniquement".<br><br><strong>Semaine 4 :</strong> Tu envoies la proposition (72 000€). Guillaume répond : "C'est dans nos cordes, je présente ça à notre CEO la semaine prochaine."<br><br><strong>Semaine 5 :</strong> Guillaume t'appelle : "Le CEO est intéressé mais il veut voir comment ça s'intègre avec notre stratégie de croissance. Il a quelques questions." Il demande une réunion à 3 (toi, lui, le CEO) pour la semaine 6.`},
      {t:'hl',v:'amber',lbl:'📁 Semaine 6 — Réunion CEO',body:`Tu rencontres <strong>Isabelle Morin, CEO de TechSprint</strong>, pour la première fois. Pendant la réunion :<br><br>— Elle pose des questions sur la réversibilité : "On ne veut pas se retrouver locked-in dans 2 ans."<br>— Elle demande des références de clients ESN utilisant votre solution.<br>— Elle mentionne : "On a une levée de fonds en cours, la gestion du cash est importante."<br>— Elle dit : "Je dois en discuter avec notre DAF — c'est lui qui valide les engagements pluriannuels."<br><br>Guillaume était silencieux pendant la majeure partie de la réunion.`},
      {t:'hl',v:'blue',lbl:'📁 Semaines 7 à 9 — La zone d\'ombre',body:`<strong>Semaine 7 :</strong> Guillaume : "Le CEO et le DAF regardent ça ensemble. C'est en bonne voie."<br><br><strong>Semaine 8 :</strong> Relance email. Réponse de Guillaume 3 jours après : "Toujours en cours de discussion en interne."<br><br><strong>Semaine 9 :</strong> Guillaume t'appelle : "Bonne nouvelle — Isabelle est favorable. Mais le DAF veut un étalement de paiement sur 3 ans plutôt qu'un paiement annuel. Et il a des questions sur les clauses de sortie du contrat."<br><br><strong>Note CRM actuelle :</strong> "Deal avancé. Guillaume très engagé. CEO favorable. Proposition 72k€. Close date : fin du mois. Probabilité : 75%."`},
      {t:'scenario',lbl:'📊 Votre mission — Scorer ce deal',p:`<p>En te basant sur tout ce que tu as lu, passe les 8 dimensions MEDDPICC en revue. Certaines sont solides, certaines sont partielles, certaines sont problématiques. Les questions suivantes vont tester ta lecture du deal.</p><p>⚠️ <strong>Conseil :</strong> Méfie-toi des signaux positifs de surface (Guillaume enthousiaste, CEO "favorable", budget annoncé). Cherche les preuves réelles derrière chaque dimension.</p>`}
    ],
    quiz:[
      {q:"Qui est l'Economic Buyer de TechSprint selon les informations disponibles ?",opts:["Les ingénieurs seniors qui ont participé à la démo","Isabelle Morin (CEO) — mais le DAF valide les engagements pluriannuels, donc potentiellement les deux","Guillaume Ferrand — il a mentionné le budget et pilote le projet","Guillaume et Isabelle conjointement"],c:1,e:"Isabelle est la CEO et l'EB apparente, mais elle a elle-même dit que le DAF valide les engagements pluriannuels. Pour un contrat de 72 000€ sur 3 ans, le DAF est co-EB ou EB réel. Problème : le DAF n'a jamais été rencontré."},
      {q:"Guillaume a annoncé 'un budget de 80 000€ alloué'. Ces Metrics sont-elles qualifiées ?",opts:["Partiellement — budget annoncé par le DSI mais la levée de fonds en cours et la gestion du cash mentionnée par la CEO créent un doute sur la disponibilité réelle","Oui — budget explicite, supérieur au prix proposé","Oui si Guillaume confirme par écrit","Non — un budget annoncé verbalement n'est jamais fiable"],c:0,e:"La levée de fonds en cours est un signal important. La CEO a mentionné que 'la gestion du cash est importante' — ce qui peut signifier que le budget théorique existe mais que son utilisation immédiate est sous pression. Le DAF doit confirmer la disponibilité réelle du budget."},
      {q:"Quelle dimension MEDDPICC est la plus problématique en semaine 9 ?",opts:["Competition — l'autre ESN n'a pas été qualifiée","Metrics — le budget n'est pas confirmé","Champion — Guillaume devient silencieux","Paper Process — étalement paiement + clauses de sortie non qualifiées + DAF jamais rencontré"],c:3,e:"Le Paper Process concentre plusieurs risques : le DAF (potentiellement co-EB) n'a jamais été rencontré, il veut un étalement sur 3 ans (impact sur votre cashflow et votre proposition), et les clauses de sortie sont en question. Ce sont des éléments qui peuvent retarder ou tuer le deal."},
      {q:"Guillaume est silencieux lors de la réunion CEO. Que révèle ce comportement ?",opts:["Il prépare une surprise positive","Il est épuisé par 6 semaines de processus","Signal d'alarme : son influence et son rôle de champion sont peut-être plus limités qu'il ne le laissait entendre face à l'EB","Il a confiance en vous — il laisse la CEO poser ses questions"],c:2,e:"Un champion fort parle en votre faveur lors des réunions avec l'EB. Il prépare la réunion, anticipe les objections, intervient pour vous soutenir. Guillaume silencieux révèle soit qu'il ne maîtrise pas la relation CEO, soit que son influence est plus technique que politique."},
      {q:"La CEO mentionne 'des références de clients ESN'. Comment évaluez-vous votre position concurrentielle ?",opts:["Incertaine — un critère implicite fort vient d'émerger (référence ESN) et vous ne savez pas si vous pouvez le satisfaire","Forte — votre approche est techniquement meilleure selon Guillaume","Faible — l'autre ESN a probablement des références","Neutre — les références ne sont pas déterminantes en B2B"],c:0,e:"Un critère implicite fort vient d'émerger lors de la réunion CEO — des références dans le secteur ESN. Si vous n'avez pas ces références, c'est un gap à adresser immédiatement. Ce critère peut peser plus lourd que les 'références formelles' du processus de sélection."},
      {q:"La note CRM indique 'Probabilité : 75%'. Est-ce justifié ?",opts:["Oui si Guillaume confirme que le DAF va valider","Oui — CEO favorable, budget dans les cordes, champion engagé","Non — DAF non rencontré, Paper Process non qualifié, critère référence ESN non adressé, levée de fonds crée une incertitude budgétaire. 40-50% serait plus honnête.","Oui pour un deal de cette taille et de cette maturité"],c:2,e:"75% est un chiffre optimiste basé sur des signaux positifs de surface. Les risques réels : DAF jamais rencontré et potentiellement co-EB, Paper Process avec étalement de paiement à négocier, critère ESN references potentiellement bloquant, incertitude budgétaire liée à la levée de fonds."},
      {q:"Quelle est l'action la PLUS urgente à prendre en semaine 9 ?",opts:["Baisser le prix pour débloquer le DAF","Relancer la CEO directement par email","Envoyer une nouvelle version de la proposition avec l'étalement sur 3 ans","Demander à Guillaume d'organiser une réunion avec le DAF — identifier ses critères, son rôle dans la décision, et qualifier les questions sur les clauses de sortie"],c:3,e:"Le DAF est un acteur critique non qualifié. Rencontrer le DAF permet de qualifier si c'est un co-EB, de comprendre ses critères sur les clauses de sortie, et de proposer proactivement une structure de paiement adaptée plutôt que d'attendre ses questions."},
      {q:"La levée de fonds en cours chez TechSprint est :",opts:["Un signal négatif — il vaut mieux attendre que la levée soit complète","Une bonne nouvelle — une levée de fonds signifie plus de budget","Sans impact sur le deal","Un Compelling Event potentiel ET un risque : la croissance prévue peut justifier l'investissement, mais la gestion du cash peut retarder la décision"],c:3,e:"La levée de fonds est ambivalente. D'un côté : si TechSprint lève des fonds pour croître, moderniser l'infra est cohérent avec cette croissance (Compelling Event potentiel). De l'autre : pendant une levée, la gestion du cash est scrutée à la loupe — le DAF peut freiner les engagements pluriannuels."},
      {q:"Quel score RAG attribuez-vous au Champion (Guillaume) en semaine 9 ?",opts:["Orange — enthousiaste et utile techniquement, mais influence limitée sur la CEO, silencieux en réunion EB, et son accès au DAF est inconnu","Rouge — il ne sert plus à rien","Vert si vous lui donnez des arguments pour défendre le deal","Vert — il est engagé depuis le début et vous a ouvert l'accès à la CEO"],c:0,e:"Orange est le score juste. Guillaume a de la valeur : il a ouvert le deal, organisé la démo, facilité l'accès à la CEO. Mais son silence lors de la réunion CEO et son accès inconnu au DAF révèlent des limites. Il est plus coach que champion au sens strict."},
      {q:"Score MEDDPICC global du deal TechSprint en semaine 9. Combien de dimensions sont vraiment vertes ?",opts:["7 — seul le DAF manque","4 — Metrics, Champion, Pain, Decision Process","5 à 6 — le deal est bien avancé","2 maximum — Decision Criteria partiellement connus et Pain identifié. Tout le reste est orange ou inconnu."],c:3,e:"En appliquant rigoureusement MEDDPICC : M=Orange (budget sous pression levée), E=Orange (CEO vue, DAF jamais rencontré), DC=Orange (critère ESN réf émergent), DP=Orange (processus rallongé par DAF), PP=Rouge (étalement, clauses sortie, DAF), I=Vert (pain réel et chiffré), Champion=Orange, Compétition=Orange. Aucune dimension vraiment verte sauf Pain."}
    ],
    caseStudy:{
      label:"📋 Synthèse — Plan d'action TechSprint",
      doc:`<p><strong>Vous êtes en semaine 9. La close date est dans 3 semaines. Voici le récapitulatif MEDDPICC :</strong></p>
<hr style="border:none;border-top:1px solid var(--border);margin:10px 0">
<p>🟡 <strong>Metrics</strong> — Budget 80k€ annoncé par DSI. Levée de fonds = incertitude cash.</p>
<p>🟡 <strong>Economic Buyer</strong> — CEO vue une fois. DAF jamais rencontré mais valide les engagements pluriannuels.</p>
<p>🟡 <strong>Decision Criteria</strong> — Critères techniques connus. Référence ESN émergente. Réversibilité importante.</p>
<p>🟡 <strong>Decision Process</strong> — CEO → DAF → signature. Timeline floue.</p>
<p>🔴 <strong>Paper Process</strong> — Étalement 3 ans, clauses sortie, DAF non qualifié.</p>
<p>🟢 <strong>Identify Pain</strong> — Douleur réelle, chiffrée (perte de productivité, retards projets clients).</p>
<p>🟡 <strong>Champion</strong> — Guillaume utile mais influence limitée sur la CEO et le DAF.</p>
<p>🟡 <strong>Competition</strong> — Autre ESN identifiée mais pas qualifiée. Statu quo possible.</p>`,
      questions:[
        {q:"Quelle est la décision la plus risquée que vous pourriez prendre en semaine 9 ?",opts:["Demander une réunion tripartite CEO + DAF + vous","Demander à Guillaume de préparer les arguments pour le DAF","Envoyer une nouvelle proposition avec l'étalement 3 ans sans avoir rencontré le DAF","Attendre que Guillaume vous revienne avec la réponse du DAF"],c:2,e:"Envoyer une proposition révisée sans avoir rencontré le DAF, c'est travailler dans le vide. Le DAF peut avoir des objections bien au-delà du mode de paiement — clauses de sortie, certifications, assurances fournisseur. Chaque version de proposition envoyée sans qualification préalable est du temps perdu."},
        {q:"Pour adresser le critère 'référence clients ESN' de la CEO, quelle est la meilleure approche ?",opts:["Expliquer que vous n'avez pas de référence ESN mais que votre solution s'adapte","Ignorer ce critère — le CEO était 'favorable' de toute façon","Promettre de construire une référence ESN après l'implémentation chez TechSprint","Identifier une référence sectorielle proche (ex: cabinet conseil, société de services IT) et proposer une mise en relation directe"],c:3,e:"Une mise en relation directe (témoignage client, référence call) est bien plus puissante qu'une promesse. Même si la référence n'est pas 100% identique (ESN vs société de services IT), un client qui parle en votre faveur adresse la vraie crainte de la CEO : est-ce que d'autres ont fait confiance à ce fournisseur dans un contexte similaire ?"},
        {q:"Si la close date dans 3 semaines n'est pas tenable, quelle est la bonne communication avec votre manager ?",opts:["Maintenir la close date à 75% pour ne pas perturber le forecast","Recalibrer : close date à +6 semaines, probabilité à 45-50%, actions prioritaires DAF et référence ESN. Un forecast honnête est toujours préférable à une surprise de pipeline.","Décaler la close date de 2 semaines — c'est suffisant","Maintenir la close date mais baisser la probabilité à 60%"],c:1,e:"Un forecast honnête permet à votre manager de vous aider — mobiliser des ressources, accélérer l'accès au DAF, trouver une référence. Un forecast optimiste cache les problèmes jusqu'au moment où le deal se perd. La transparence sur les risques est une compétence professionnelle, pas un aveu de faiblesse."}
      ]
    }
  },

  // ═══════════════════ MODULE 14 — CERTIFICATION ═══════════════════
  {
    id:'certification', nav:'Certification finale', sub:'Examen — Module 14',
    badge:'🏆 Certification', title:'Examen de certification MEDDPICC',
    subtitle:"30 questions sur l'ensemble de la formation — des questions de compréhension, des pièges, des scénarios. Bronze, Argent ou Or : à toi de jouer.",
    blocks:[
      {t:'hl',v:'blue',lbl:'📋 Règles de l\'examen',body:`— <strong>31 questions</strong> couvrant toutes les dimensions MEDDPICC<br>— Questions de compréhension, pièges, scénarios réels<br>— Aucun retour en arrière — chaque réponse est définitive<br>— Résultat immédiat avec analyse détaillée<br><br><strong>Niveaux de certification :</strong><br>🥇 <strong>Or</strong> : 28-31 bonnes réponses (90%+)<br>🥈 <strong>Argent</strong> : 23-27 bonnes réponses (73-89%)<br>🥉 <strong>Bronze</strong> : 19-22 bonnes réponses (60-72%)<br>📖 <strong>À revoir</strong> : moins de 19 — reprendre les modules concernés`},
      {t:'prose',h:'',p:`<p>Cet examen évalue ta maîtrise globale de MEDDPICC — une question par dimension, plus des cas d'intégration. Chaque question teste ta capacité à <strong>appliquer</strong> le bon raisonnement dans des situations réelles.</p><p>Prends le temps de lire chaque question. Méfie-toi des réponses qui semblent "évidemment vraies" — MEDDPICC a ses propres logiques qui contredisent parfois l'intuition commerciale classique.</p>`}
    ],
    quiz:[
      {q:"[M] Un prospect dit : 'Votre solution va vraiment améliorer notre productivité.' C'est :",opts:["Une métrique valide si le prospect confirme par écrit","Une aspiration générale — il faut la convertir en chiffre : combien d'heures, combien d'euros, sur quelle période ?","Une métrique qualifiée — améliorer la productivité est un objectif mesurable","Une métrique opérationnelle — suffisante pour construire la proposition"],c:1,e:"Sans chiffre, 'améliorer la productivité' est une intention. Une métrique réelle répond à : quel baseline ? quelle cible ? quel delta ? quel horizon ? Construire cette équation avec le prospect est la condition pour que la valeur soit défendable face à l'EB."},
      {q:"[E] Votre interlocuteur vous dit être 'autonome pour prendre cette décision'. Pour valider, vous demandez :",opts:["Vous le croyez — il connaît son organisation","'Avez-vous déjà pris ce type de décision seul par le passé ?'","'Pouvez-vous signer dès aujourd'hui ?'","'Super. Et pour un engagement de ce montant, y a-t-il d'autres validations nécessaires avant la signature ?' — sans challenger son autorité"],c:3,e:"La question 'y a-t-il d'autres validations ?' valide l'autorité réelle sans la challenger. Elle est formulée dans le sens de 'aider le processus' plutôt que 'douter de vous'. Si la personne est vraiment autonome, elle confirmera. Si non, vous découvrirez le Paper Process."},
      {q:"[DC] Quelle est la différence entre un critère de décision explicite et implicite ?",opts:["Il n'y a pas de différence pratique","L'implicite n'existe que dans les grandes organisations","L'explicite est formalisé par le client, l'implicite est non verbalisé — les deux peuvent être décisifs et les implicites sont souvent plus lourds","L'explicite est plus important que l'implicite"],c:2,e:"Les critères implicites — 'on préfère un fournisseur français', 'le DG veut de la simplicité' — sont souvent plus déterminants que les critères formels. Ils ne seront jamais dans un RFP mais peuvent tuer un deal en fin de course si vous ne les avez pas détectés."},
      {q:"[DP] Un commercial a 12 réunions avec un prospect en 3 mois. Le deal avance-t-il ?",opts:["Non — 12 réunions c'est trop, il faut conclure plus vite","Oui si les réunions impliquent de plus en plus de personnes","Pas nécessairement — 12 réunions sans étape formelle franchie indique un deal qui tourne en rond","Oui — 12 réunions montrent un engagement fort"],c:2,e:"L'activité n'est pas synonyme d'avancement. La vraie question : 'Quelle étape formelle du Decision Process a été franchie depuis 3 mois ?' Sans étape formelle, 12 réunions ne sont que 12 conversations qui coûtent du temps."},
      {q:"[PP] Quelle est la meilleure définition du Paper Process ?",opts:["Tout ce qui se passe entre 'la décision d'acheter est prise' et 'le contrat est signé' — approbations, juridique, achats, DPA","La signature du contrat final","La procédure interne de sélection des fournisseurs","La négociation des termes commerciaux"],c:0,e:"Le Paper Process commence après le 'oui' de l'EB. C'est souvent là que les deals se perdent ou glissent — non parce que le client ne veut plus acheter, mais parce que le chemin vers la signature n'avait pas été anticipé."},
      {q:"[I] Quelle est la différence entre une 'douleur' et un 'problème' en MEDDPICC ?",opts:["La douleur est physique, le problème est organisationnel","Un problème vient du client, une douleur est créée par le commercial","Un problème peut exister sans urgence d'agir. Une douleur a un coût, un risque ou une urgence qui justifient l'action maintenant.","Il n'y a pas de différence — les deux termes sont interchangeables"],c:2,e:"'Notre infra est vieille' est un problème — le client peut vivre avec. 'Notre infra vieillissante nous expose à des pénalités de 5 000€/incident sur notre contrat grand compte' est une douleur — le client doit agir."},
      {q:"[C] Comment tester si votre contact est un vrai Champion ou seulement un coach ?",opts:["Observer s'il répond vite à vos emails","Lui demander s'il est prêt à 'soutenir votre solution'","Vérifier son titre dans l'organisation","Lui demander d'agir concrètement — organiser une réunion EB, partager une information stratégique, défendre un argument en interne. Un champion fait. Un coach promet."],c:3,e:"Un champion se teste par l'action, pas par les intentions. Les déclarations de soutien ne valent rien. Ce qui compte : fait-il ce qu'il dit ? Si oui, c'est un champion. Si non, c'est un contact agréable."},
      {q:"[C] Vous avez identifié un concurrent direct. Quelle est votre première question ?",opts:["Depuis combien de temps travaillent-ils avec ce prospect ?","Est-ce que ce concurrent répond aux critères non-négociables du client, notamment ceux qui jouent en votre faveur ?","Combien de références ont-ils dans ce secteur ?","Quel est leur prix ?"],c:1,e:"La première étape n'est pas d'attaquer le concurrent mais de vérifier s'il répond vraiment aux critères clés. S'il ne répond pas à un critère non-négociable (hébergement France, SLA requis), le débat sur le prix ne se pose pas."},
      {q:"[Intégration] Un deal a un Champion solide, un Pain fort et des Metrics validées. Mais le Paper Process est inconnu depuis 4 semaines. Ce deal est :",opts:["Orange global — une dimension inconnue depuis 4 semaines = une bombe à retardement sur la close date","Vert — l'essentiel est qualifié","Vert sur les dimensions qualifiées — le Paper Process est secondaire","Rouge — un inconnue invalide toutes les autres dimensions"],c:0,e:"Le principe 'one unknown = one action' s'applique strictement. 4 semaines sans qualifier le Paper Process dans un deal mature est anormal. C'est la cause principale des close dates manquées sur des deals par ailleurs bien qualifiés."},
      {q:"[Méthode] Quelle est la règle 'zéro supposition' de MEDDPICC ?",opts:["Ne jamais prendre de décision sans consulter son manager","Si une information n'est pas prouvée par un fait vérifiable, elle reste 'inconnue' et génère une action datée — jamais une supposition optimiste","Ne jamais envoyer de proposition sans validation interne","Toujours confirmer les réunions par email"],c:1,e:"La règle zéro supposition est le cœur de MEDDPICC. Ce qui n'est pas prouvé est inconnu — et chaque inconnu génère une action datée avec un owner. Les forecasts basés sur des suppositions créent les mauvaises surprises de fin de trimestre."},
      {q:"[E] L'EB d'une PME de 60 personnes est :",opts:["Toujours le DG","Celui qui a l'autorité réelle pour approuver la dépense et signer — titre indicatif, à vérifier","Le responsable qui pilote le projet au quotidien","Toujours le DSI sur les sujets IT"],c:1,e:"L'EB n'est pas un titre — c'est une autorité réelle. Dans une PME de 60 personnes, ce peut être le DG, le DAF, ou même un DSI avec délégation explicite. Il faut toujours vérifier qui a réellement signé les décisions d'investissement similaires par le passé."},
      {q:"[DC] Vous avez influencé les Decision Criteria en faveur de votre solution. C'est :",opts:["De la manipulation — contraire à l'éthique commerciale","Acceptable uniquement si le client n'a pas de grille formelle","Uniquement applicable en début de cycle, pas après un RFP","Légitime si vous aidez le client à mieux structurer sa décision en mettant en valeur des critères réellement importants pour lui"],c:3,e:"Influencer les critères tôt dans le cycle est une compétence commerciale légitime — pas de la manipulation. Vous aidez le client à formaliser des priorités qui lui correspondent, en mettant en valeur celles sur lesquelles vous excellez. Le client prend une meilleure décision."},
      {q:"[DP] Votre close date est dans 6 semaines. Vous n'avez pas construit le Reverse Timeline. Que faites-vous ?",opts:["Construire le Reverse Timeline en urgence — il peut révéler que 6 semaines est insuffisant et forcer à décaler ou à accélérer certaines étapes","Laisser la close date telle quelle — 6 semaines c'est suffisant","Demander au prospect de confirmer la close date par email","Décaler la close date de 3 mois par précaution"],c:0,e:"Le Reverse Timeline révèle souvent l'impossibilité d'une close date. 6 semaines peuvent sembler larges mais contenir : validation EB (1 sem), validation DAF (1 sem), relecture juridique (3 sem), onboarding fournisseur (1 sem). Soit 7 semaines minimum. Mieux vaut le savoir maintenant."},
      {q:"[PP] Un client dit qu'il n'y a pas de service achats dans son organisation. Que faites-vous ?",opts:["Concluez que le Paper Process est vert","Envoyez le contrat immédiatement pour profiter de la fenêtre","Notez-le mais vérifiez quand même : qui valide les engagements > X€ ? Qui a vu les CGV du contrat ? Le DG peut toujours vouloir une validation d'un expert-comptable.","Vous le croyez — l'absence de service achats simplifie le Paper Process"],c:2,e:"L'absence de service achats ne signifie pas l'absence de Paper Process. L'expert-comptable, l'avocat, le DAF informel, le conjoint DG dans une TPE — tout peut créer du délai. La question 'entre la décision et la signature, il se passe quoi chez vous ?' reste toujours nécessaire."},
      {q:"[I] Quelle est la valeur d'un Compelling Event pour votre deal ?",opts:["Il crée une deadline naturelle externe qui justifie d'agir maintenant plutôt que de repousser — rend le statu quo risqué sans que le commercial ait à imposer l'urgence","Il n'est utile qu'en fin de cycle pour accélérer la signature","Il crée une urgence artificielle que le client finit toujours par percevoir","Il remplace les Metrics si la douleur est forte"],c:0,e:"Un Compelling Event externe (fin de support, audit prévu, renouvellement contractuel) crée une urgence que le client ne peut pas nier. Le commercial n'a pas à 'créer' la pression — il aide le client à voir ce que lui coûte l'attente."},
      {q:"[C/Champion] Votre champion est muté dans une autre division. Actions immédiates :",opts:["Contacter l'EB directement par email froid","Demander à votre champion sortant de vous introduire immédiatement auprès d'un autre contact et/ou de l'EB directement. Chaque jour compte avant son départ.","Attendre le recrutement de son remplaçant","Mettre le deal en pause"],c:1,e:"Chaque heure avec votre champion sortant est précieuse. Il peut vous introduire auprès de son successeur, organiser une réunion avec l'EB, ou transmettre le contexte du projet. Après son départ, toutes ces portes se ferment. Agissez immédiatement."},
      {q:"[Intégration] La différence principale entre un forecast à 70% basé sur MEDDPICC et un forecast à 70% basé sur l'intuition :",opts:["Il n'y a pas de différence — les deux aboutissent au même résultat","MEDDPICC est plus conservateur","MEDDPICC repose sur des preuves par dimension et révèle les risques. L'intuition repose sur l'impression générale et cache les risques.","L'intuition est plus rapide et souvent aussi précise"],c:2,e:"La différence n'est pas le chiffre — c'est la qualité de l'information derrière. Un 70% MEDDPICC dit : 'EB rencontrée, Pain validé, Decision Process cartographié, Paper Process en cours'. Un 70% intuitif dit : 'le client est sympa et répond vite'. Lequel est fiable pour un forecast d'équipe ?"},
      {q:"[M] Comment rendre une métrique 'inattaquable' lors d'un comité de décision ?",opts:["En la co-construisant avec le client — si c'est lui qui a fourni les chiffres, il ne peut pas les contredire en réunion","En la validant avec votre management avant de la présenter","En la calculant vous-même avec les données les plus récentes du secteur","En la documentant dans la proposition commerciale"],c:0,e:"Une métrique co-construite appartient au client. Si c'est le DSI qui a dit '3 pannes par an à 8 000€ chacune', ce chiffre sera défendu par le client lui-même face aux sceptiques internes. Une métrique imposée par le commercial sera toujours challengée."},
      {q:"[DC + E] Un critère de décision est validé par le DSI mais jamais confirmé par le DG (EB). Ce critère est :",opts:["Vert si le DSI confirme que le DG est aligné","Rouge — seuls les critères de l'EB comptent","Orange — techniquement valide mais non confirmé par l'EB. Si le DG a d'autres priorités, ce critère peut être réévalué au moment de la décision.","Vert — le DSI est le mieux placé pour définir les critères techniques"],c:2,e:"Les critères doivent être validés par les personnes qui décident. Un critère technique important pour le DSI peut être secondaire pour le DG qui voit le projet sous l'angle du risque et du budget. La validation EB des critères clés est nécessaire."},
      {q:"[Méthode] MEDDPICC est utile :",opts:["À n'importe quel stade d'un deal — y compris sur des deals existants pour identifier les gaps et les risques","Uniquement pour les nouveaux deals non encore engagés","Uniquement pour les commerciaux expérimentés","Uniquement lors des deal reviews formelles"],c:0,e:"MEDDPICC s'applique à n'importe quel stade. Sur un deal existant, la première application est de scorer les 8 dimensions et d'identifier les gaps. C'est souvent cette inspection qui révèle pourquoi un deal 'bien engagé' stagne depuis des semaines."},
      {q:"[C/Competition] Votre prospect vous dit que le statu quo est une option sérieuse. Votre réponse :",opts:["Revenir sur le coût d'inaction et les Compelling Events — rendre le statu quo plus douloureux que le changement, avec les chiffres du client","Proposer un pilote gratuit pour réduire le risque perçu","Expliquer que votre solution est meilleure que le statu quo","Baisser votre prix pour éliminer le facteur coût"],c:0,e:"Le statu quo se bat avec le coût d'inaction. 'Ne rien faire' coûte X par mois — si ce chiffre est plus élevé que votre solution, le statu quo n'est plus rationnel. Et si un Compelling Event existe (fin de support, audit), l'inaction devient activement risquée."},
      {q:"[PP + DP] Un deal a un Decision Process vert mais un Paper Process inconnu. La close date est réaliste ?",opts:["Oui si l'EB a confirmé verbalement son accord","Non — Decision Process et Paper Process sont deux chemins distincts. La décision d'acheter peut être prise, et le contrat peut quand même mettre 6 semaines à être signé.","Oui si c'est une PME sans processus complexe","Oui — si la décision est prise, la signature suivra rapidement"],c:1,e:"C'est précisément pourquoi le P a été ajouté à MEDDIC. Le Decision Process vert veut dire 'la décision d'acheter sera prise'. Le Paper Process inconnu veut dire 'on ne sait pas combien de temps il faudra pour signer.' Ces deux chemins peuvent diverger de plusieurs semaines."},
      {q:"[I] 'Notre DSI veut moderniser l'infra' — c'est une douleur qualifiée ?",opts:["Oui — le DSI est le décideur technique et son désir est clair","Oui si le projet est dans le budget annuel","Oui si le DSI peut chiffrer le projet","Non — 'vouloir moderniser' est une aspiration, pas une douleur. Il manque le coût, l'urgence et l'implication des conséquences."],c:3,e:"Une aspiration n'est pas une douleur. Il faut creuser : pourquoi maintenant ? qu'est-ce qui se passe si on ne modernise pas ? quel est le coût des problèmes actuels ? Quand ces réponses sont chiffrées et partagées par l'EB, c'est une douleur qualifiée."},
      {q:"[E + Champion] La différence entre l'EB et le Champion :",opts:["Ce sont deux noms pour le même rôle","L'EB est technique, le Champion est commercial","L'EB a l'autorité finale pour approuver la dépense. Le Champion a l'enthousiasme, l'influence et l'accès — mais n'a pas toujours le pouvoir financier de signer.","L'EB est toujours en interne, le Champion peut être externe"],c:2,e:"Un DSI peut être un excellent Champion (enthousiaste, influent, accès) sans être l'EB. Le DG peut être l'EB sans être le Champion. Les deux rôles sont complémentaires et nécessaires — manquer l'un des deux fragilise le deal différemment."},
      {q:"[DC] Vous avez identifié 8 critères de décision explicites. Quelle est la priorité ?",opts:["Chercher les critères implicites qui manquent","Demander au prospect de les pondérer formellement","Répondre parfaitement aux 8 critères","Identifier lesquels sont réellement non-négociables (3 à 4 max) et concentrer votre différenciation là-dessus"],c:3,e:"8 critères ont rarement tous le même poids. 3-4 critères sont généralement décisifs — les autres sont des hygiènes de base. Identifier les critères différenciants et y concentrer votre énergie est plus efficace que de vouloir exceller sur tout."},
      {q:"[Intégration] Un deal a toutes les dimensions vertes sauf la Competition (inconnu). Risque ?",opts:["Réel — un concurrent non qualifié peut avoir proposé quelque chose de disqualifiant (ex: prix 40% moins cher, référence sectorielle forte). Une inconnue en Competition peut invalider un deal par ailleurs solide.","Nul — si l'EB est alignée, la Competition n'a pas d'importance","Faible — les autres dimensions compensent","Faible si le Champion confirme votre avance"],c:0,e:"La Competition inconnu ne veut pas dire absence de compétition. Un concurrent non qualifié peut proposer quelque chose que vous ne savez pas contrer. Et le statu quo — le concurrent oublié — peut toujours être la décision par défaut si vous n'avez pas adressé l'urgence d'agir."},
      {q:"[Méthode] Quel est le principal bénéfice d'une deal review MEDDPICC vs une deal review classique ?",opts:["Elle inspecte la qualité des preuves par dimension et génère des actions sur les gaps — pas seulement un statut de pipeline","Elle est plus appréciée des commerciaux","Elle nécessite moins de préparation","Elle prend moins de temps"],c:0,e:"Une deal review MEDDPICC ne demande pas 'où en es-tu ?' mais 'quelle preuve as-tu pour chaque dimension ?' Ce changement transforme la revue en outil de coaching et de prévision — pas de rapport d'avancement."},

function renderCaseStudy(cs, modId){
  if(!cs) return '';
  const letters = ['A','B','C','D'];
  const questions = cs.questions.map((q,qi) => `

const csAnswers = {};
function answerCS(modId, qi, oi, correct){
  const key = `cs-${modId}-${qi}`;
  if(csAnswers[key] !== undefined) return;
  csAnswers[key] = oi;
  const opts = document.querySelectorAll(`[id^="csopt-${modId}-${qi}-"]`);
  opts.forEach(b => b.disabled = true);
  const chosen = document.getElementById(`csopt-${modId}-${qi}-${oi}`);
  const correctBtn = document.getElementById(`csopt-${modId}-${qi}-${correct}`);
  if(oi === correct){ chosen.classList.add('correct'); }
  else { chosen.classList.add('wrong'); correctBtn.classList.add('reveal'); }
  document.getElementById(`csexpl-${modId}-${qi}`).classList.add('show');
  saveProgress();
}

// ═══════════════════════ PERSISTENCE ════════════════
const SAVE_KEY = 'meddpicc_progress';

function saveProgress(){
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      current: state.current,
      done: [...state.done],
      quizDone: [...state.quizDone],
      quizAnswers: quizAnswers,
      csAnswers: csAnswers
    }));
  } catch(e) {}
}

function loadProgress(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const saved = JSON.parse(raw);
    state.current = saved.current || 0;
    state.done = new Set(saved.done || []);
    state.quizDone = new Set(saved.quizDone || []);
    Object.assign(quizAnswers, saved.quizAnswers || {});
    Object.assign(csAnswers, saved.csAnswers || {});
    return true;
  } catch(e) { return false; }
}

function resetProgress(){
  if(!confirm('Remettre la formation à zéro ? Ta progression sera effacée.')) return;
  localStorage.removeItem(SAVE_KEY);
  state.current = 0;
  state.done = new Set();
  state.quizDone = new Set();
  Object.keys(quizAnswers).forEach(k => delete quizAnswers[k]);
  Object.keys(csAnswers).forEach(k => delete csAnswers[k]);
  navigateTo(0);
}

  const letters = ['A','B','C','D'];

            ${opt}
          </button>`).join('')}

  return `

// ═══════════════════════ QUIZ LOGIC ══════════════════

const quizAnswers = {};

function answerQuiz(modId, qi, oi, correct){
  const key = `${modId}-${qi}`;
  if(quizAnswers[key] !== undefined) return;
  quizAnswers[key] = oi;

  const opts = document.querySelectorAll(`[id^="opt-${modId}-${qi}-"]`);
  opts.forEach(btn => btn.disabled = true);

  const chosen = document.getElementById(`opt-${modId}-${qi}-${oi}`);
  const correctBtn = document.getElementById(`opt-${modId}-${qi}-${correct}`);

  if(oi === correct){
    chosen.classList.add('correct');
    document.getElementById(`qq-${modId}-${qi}`).classList.add('ok');
  } else {
    chosen.classList.add('wrong');
    correctBtn.classList.add('reveal');
    document.getElementById(`qq-${modId}-${qi}`).classList.add('ko');
  }

  document.getElementById(`expl-${modId}-${qi}`).classList.add('show');

  // Check if all questions answered
  const mod = MODULES.find(m=>m.id===modId);
  if(!mod || !mod.quiz) return;
  saveProgress();
  const allDone = mod.quiz.every((_,i) => quizAnswers[`${modId}-${i}`] !== undefined);
  if(allDone) showQuizResult(modId, mod.quiz);
}

function showQuizResult(modId, quiz){
  let score = 0;
  quiz.forEach((_,i)=>{
    if(quizAnswers[`${modId}-${i}`] === quiz[i].c) score++;
  });
  const pct = Math.round(score/quiz.length*100);
  const isCert = modId === 'certification';
  let msg, col;
  if(isCert){
    msg = pct>=90 ? '🥇 Or — Expert MEDDPICC' : pct>=73 ? '🥈 Argent — Maîtrise solide' : pct>=60 ? '🥉 Bronze — Bases acquises' : '📖 À revoir — Reprendre les modules';
    col = pct>=90 ? 'var(--green)' : pct>=73 ? 'var(--blue)' : pct>=60 ? 'var(--amber)' : 'var(--red)';
  } else {
    msg = pct===100 ? '🏆 Parfait !' : pct>=67 ? '✅ Bonne maîtrise' : '📖 À revoir';
    col = pct===100 ? 'var(--green)' : pct>=67 ? 'var(--blue)' : 'var(--amber)';
  }

  const res = document.getElementById(`quiz-result-${modId}`);
  res.style.display = 'block';
  const certBadge = modId === 'certification' && pct >= 60 ? `
    <div style="text-align:center;margin:16px 0;padding:20px;background:linear-gradient(135deg,#0C2762,#1659E4);border-radius:12px;color:#fff">
      <div style="font-size:40px;margin-bottom:8px">${pct>=90?'🥇':pct>=73?'🥈':'🥉'}</div>
      <div style="font-family:Outfit,sans-serif;font-size:22px;font-weight:900">${msg}</div>
      <div style="font-size:13px;opacity:.8;margin-top:6px">MEDDPICC Certification — ${score}/31 questions</div>
    </div>` : '';
  res.innerHTML = `
    <div class="quiz-result">
      ${certBadge}
      <div class="result-score" style="color:${col}">${score}/${quiz.length}</div>
      <div class="result-lbl">${msg} — ${pct}% de bonnes réponses</div>
    </div>`;
  // Révéler le bouton Continuer qui est après l'étude de cas
  const contBtn = document.getElementById(`continue-btn-${modId}`);
  if(contBtn) { contBtn.style.display = 'block'; contBtn.scrollIntoView({behavior:'smooth', block:'center'}); }

  state.quizDone.add(modId);
}

function markDoneAndNext(idx){
  state.done.add(idx);
  updateProgress();
  saveProgress();
  if(idx < MODULES.length-1) navigateTo(idx+1);
}

function renderModule(mod){

function buildNav(){
  const nav = document.getElementById('nav-list');
  let html = '';
  MODULES.forEach((mod, i) => {
    const cls = ['nav-item',
      i===state.current ? 'active' : '',
      state.done.has(i) ? 'done' : ''
    ].filter(Boolean).join(' ');

    const num = i === 0 ? '★' : (i);

    html += `
      <div class="${cls}" onclick="navigateTo(${i})" id="nav-${i}">
        <div class="nav-dot" style="${i===0?'font-size:11px':''}">
          ${state.done.has(i) ? '' : num}
        </div>
        <div class="nav-text">
          <div class="nav-sub">${mod.sub}</div>
          <div class="nav-name">${mod.nav}</div>
        </div>
      </div>`;
  });
  nav.innerHTML = html;
}

function showResumeToast(){
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#0C2762;color:#fff;border:1px solid rgba(107,231,221,.4);border-radius:8px;padding:12px 18px;font-size:13px;font-family:DM Sans,sans-serif;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.3);opacity:0;transition:opacity .3s';
  t.innerHTML = '✅ Progression restaurée — bon retour !';
  document.body.appendChild(t);
  setTimeout(() => t.style.opacity = '1', 50);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 400); }, 3000);
}

function updateProgress(){
  const total = MODULES.length - 1;
  const done = state.done.size;
  const pct = Math.round(done/total*100);
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('pfill').style.width = pct + '%';
}

function navigateTo(idx){
  state.current = idx;
  const mod = MODULES[idx];
  const content = document.getElementById('content');
  content.innerHTML = mod.welcome ? renderWelcome() : renderModule(mod);
  buildNav();
  updateProgress();
  saveProgress();
  window.scrollTo({top:0, behavior:'smooth'});
  document.getElementById('main').scrollTo({top:0, behavior:'smooth'});
}

  const resumed = loadProgress();
  buildNav();
  navigateTo(state.current);
  if(resumed && state.current > 0) setTimeout(showResumeToast, 400);
  // Si reprise, ré-appliquer les réponses quiz sur la page courante
  if(resumed && state.current > 0){
    const mod = MODULES[state.current];
    if(mod && mod.quiz){
      mod.quiz.forEach((_,qi) => {
        const key = `${mod.id}-${qi}`;
        const oi = quizAnswers[key];
        if(oi !== undefined){
          const correctBtn = document.getElementById(`opt-${mod.id}-${qi}-${mod.quiz[qi].c}`);
          const chosenBtn = document.getElementById(`opt-${mod.id}-${qi}-${oi}`);
          if(correctBtn && chosenBtn){
            document.querySelectorAll(`[id^="opt-${mod.id}-${qi}-"]`).forEach(b => b.disabled = true);
            if(oi === mod.quiz[qi].c) chosenBtn.classList.add('correct');
            else { chosenBtn.classList.add('wrong'); correctBtn.classList.add('reveal'); }
            const expl = document.getElementById(`expl-${mod.id}-${qi}`);
            if(expl) expl.classList.add('show');
          }
        }
      });
      // Si quiz complet, réafficher résultat et bouton continuer
      const allDone = mod.quiz.every((_,qi) => quizAnswers[`${mod.id}-${qi}`] !== undefined);
      if(allDone) showQuizResult(mod.id, mod.quiz);
    }
  }
});
</script>
</body>
</html>
